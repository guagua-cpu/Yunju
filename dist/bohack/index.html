<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdf9">
<title>户型装修设计</title>
<style>
:root{
  --bg:#f3efe7; --paper:#f7f4ee; --panel:#fffdf9; --line:#e3dccf; --ink:#2b2824; --muted:#8a8174;
  --accent:#b5653a; --accent-soft:#f3e3d8; --teal:#2f5d62;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) 30px;grid-template-columns:236px minmax(0,1fr) 300px;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;margin-right:8px;line-height:1.25}
.brand b{font-size:15px;letter-spacing:.5px}
.brand span{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2ece2}
.btn.on{background:var(--ink);color:#fff}
.btn.chip.on{background:var(--accent-soft);color:var(--accent)}
#langSel .btn{min-width:32px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#9f5530}
.btn.danger{color:#b3372a}
.spacer{flex:1}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line)}
.lib h4{margin:0;padding:12px 14px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 6px}
.lib h4{position:sticky;top:0;z-index:1;background:var(--panel)}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:grab;user-select:none;touch-action:pan-y;transition:border-color .15s,transform .15s}
.item.dragging{border-color:var(--accent);opacity:.5}
@media (hover:hover){.item:hover{border-color:var(--accent);transform:translateY(-1px)}}
#ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:.8;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(40,30,20,.3))}
#ghost svg{width:100%;height:100%;display:block;overflow:visible}
.item svg{width:56px;height:44px}
.item b{font-weight:500;font-size:12px}
.item small{color:var(--muted);font-size:11px}
.hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}
main{position:relative;overflow:hidden;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:default}
#plan.panning{cursor:grabbing}
#plan.tool-measure{cursor:crosshair}
#plan .wall{pointer-events:none}
#plan.tool-demolish .wall{pointer-events:all;cursor:pointer}
#plan.tool-demolish .wall:hover{fill:#d9894f}
#plan.tool-select .room:hover{opacity:.82}
#plan.tool-wall,#plan.tool-win,#plan.tool-door,#plan.tool-slide,#plan.tool-room,#plan.tool-calibrate,#plan.tool-mepLine,#plan.tool-mepNode{cursor:crosshair}
#gMep{pointer-events:none}
#gMep .mep-hit,#gMep .mep-vert,#gMep .mep-node{pointer-events:all;cursor:pointer}
#gMep .mep-vert{cursor:move}
#plan.tool-select .wall{pointer-events:all;cursor:pointer}
#wallKindGrp{display:none}
body.draw-wall #wallKindGrp{display:flex}
#mepTypeGrp,#mepNodeGrp{display:none!important}
body.draw-mep-line #mepTypeGrp{display:flex!important}
body.draw-mep-node #mepNodeGrp{display:flex!important}
.menu-pop hr{margin:4px 0}
#plan .furn{cursor:move}
@media (hover:hover){#plan .furn:hover{filter:drop-shadow(0 0 2px rgba(181,101,58,.7))}}
[data-handle]{cursor:pointer}
[data-handle=size]{cursor:nwse-resize}
.scalebar{position:absolute;left:14px;bottom:12px;background:rgba(255,253,249,.92);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}
.scalebar .bar{height:6px;border:1.5px solid var(--ink);border-top:0;margin-top:3px}
.modehint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:5px 12px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.modehint.show{opacity:.9}
footer{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--panel);overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tip{overflow:hidden;text-overflow:ellipsis}
footer b{color:var(--ink);font-weight:500}
#panel section{padding:12px 16px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:13px}
#panel h3 small{color:var(--muted);font-weight:400;margin-left:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 2px;border-bottom:1px dashed #eee6d9}
td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf5ee}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.total{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.total b{color:var(--accent)}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.form input[type=color]{padding:2px;height:30px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{border:1px solid var(--line);background:#fff}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;cursor:pointer;text-align:left}
.mat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mat i{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.mat span{font-size:12px;line-height:1.3}
.mat small{display:block;color:var(--muted)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f2ece2;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:#faf6ef;border-radius:8px;padding:8px}
.stats small{display:block;color:var(--muted);font-size:11px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- 2D / 3D 切换 ---------- */
.seg{position:relative;padding:3px}
.seg .btn{position:relative;z-index:1;width:82px;transition:color .45s}
.seg .btn:hover{background:transparent}
.seg .pill{position:absolute;left:3px;top:3px;bottom:3px;width:82px;border-radius:6px;background:var(--accent);
  box-shadow:0 2px 6px rgba(181,101,58,.35);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.seg .btn[data-view="2d"],body.m3d .seg .btn[data-view="3d"]{color:#fff}
body.m3d .seg .btn[data-view="2d"]{color:var(--ink)}
body.m3d .seg .pill{transform:translateX(84px)}
body.busy .seg{pointer-events:none}
body.m3d .only2d,body:not(.m3d) .only3d{display:none!important}
.only2d,.only3d{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#plan{transition:opacity .45s ease,transform .45s ease}
main.is3d #plan{opacity:0;pointer-events:none}
.scalebar{transition:opacity .3s}
main.is3d .scalebar{opacity:0}
#view3d{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
main.is3d #view3d{opacity:1;visibility:visible;transition:opacity .45s ease}
#view3d canvas{display:block;outline:none}
#walkOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,28,25,.35);z-index:3;cursor:pointer}
#walkOverlay>div{background:var(--panel);border-radius:14px;padding:22px 28px;text-align:center;max-width:360px}
#walkOverlay h3{margin:0 0 6px}
#walkOverlay p{margin:4px 0;color:var(--muted)}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:2;display:none;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#hint3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(43,40,36,.82);color:#fff;border-radius:20px;
  padding:5px 14px;font-size:12px;z-index:2;pointer-events:none;white-space:nowrap;transition:opacity .4s}
main.animating #hint3d{opacity:0}
.rlabel{font-size:12px;font-weight:600;color:#2b2824;background:rgba(255,253,249,.9);border:1px solid var(--line);
  border-radius:12px;padding:2px 9px;white-space:nowrap;pointer-events:none}
.rlabel small{font-weight:400;color:var(--muted);margin-left:4px}
#roomList{padding:0 10px 6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
#roomList button{display:flex;flex-direction:column;width:100%;border:1px solid var(--line);background:#fff;padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left;line-height:1.3}
#roomList button:hover{background:#f2ece2}
#roomList button.on{background:var(--accent-soft);color:var(--accent)}
#roomList small{color:var(--muted);font-variant-numeric:tabular-nums}
.mep-legend{padding:8px 12px 14px;border-top:1px solid var(--line);margin-top:6px}
.mep-legend h4{margin:0 0 8px;font-size:12px;font-weight:600}
.mep-legend ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.mep-legend li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
.mep-legend i{width:14px;height:6px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.mep-legend .muted{margin:8px 0 0;font-size:11px;line-height:1.4}
.range{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted);font-size:12px}
.range input{width:100px;accent-color:var(--accent)}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;min-width:150px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(40,30,20,.14);z-index:20;animation:fadeIn .2s ease}
.menu-pop .btn{text-align:left}
.range span{font-variant-numeric:tabular-nums;color:var(--ink)}
/* ---------- 选中后的浮动工具条 ---------- */
#fab{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;align-items:center;gap:4px;padding:5px;
  background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(40,30,20,.16);
  z-index:4;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s linear .2s;max-width:calc(100% - 24px)}
main.drawer-panel #fab{opacity:0;visibility:hidden}
#fab.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s}
#fab .name{padding:0 8px 0 6px;font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fab .btn{border:1px solid transparent}
#fab .sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line)}
/* ---------- 触屏漫游摇杆 ---------- */
#joy{position:absolute;left:28px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,253,249,.25);
  border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;display:none;touch-action:none;backdrop-filter:blur(3px)}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,253,249,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#walkExit{position:absolute;right:16px;bottom:28px;z-index:3;display:none}
/* ---------- 触屏：加大点击区域 ---------- */
@media (pointer:coarse){
  body{font-size:14px}
  header{padding:8px 12px;gap:8px}
  .grp{padding:3px;border-radius:10px}
  .btn{padding:8px 12px;min-height:38px;border-radius:8px}
  .seg .btn,.seg .pill{width:92px}
  body.m3d .seg .pill{transform:translateX(94px)}
  .menu summary{padding:9px 14px}
  .menu-pop .btn{padding:11px 14px}
  .item{padding:10px 4px 8px}
  .form input,.form select{font-size:16px;padding:8px 9px}
  .form input[type=color]{height:40px}
  .actions .btn,#fab .btn{min-height:42px;padding:9px 14px}
  td{padding:7px 2px}
  #roomList button{padding:8px 10px}
  .mat{padding:9px 8px}
  .range input{width:120px!important}
}
/* ---------- 竖屏 / 窄屏（如 iPad 竖握）：侧栏改为抽屉 ---------- */
/* ---------- 宽屏：左右面板可收起 ---------- */
@media (min-width:1101px){
  .app{transition:grid-template-columns .3s cubic-bezier(.3,.7,.3,1)}
  .app.hide-lib{grid-template-columns:0 minmax(0,1fr) 300px}
  .app.hide-panel{grid-template-columns:236px minmax(0,1fr) 0}
  .app.hide-lib.hide-panel{grid-template-columns:0 minmax(0,1fr) 0}
  .app.hide-lib aside.lib,.app.hide-panel aside.right{overflow:hidden;border:0}
  aside{overflow-x:hidden}
  aside.lib>div{min-width:220px} #panel{min-width:284px}   /* 收起动画中内容不被挤压变形 */
}
.narrow-only{display:none!important}
@media (max-width:1100px){
  .grp.narrow-only{display:flex!important}
  .btn.narrow-only,#fab .btn.narrow-only{display:inline-block!important}
  .app{grid-template-columns:minmax(0,1fr)}
  main,aside.lib,aside.right{grid-row:2;grid-column:1}
  aside.lib,aside.right{position:relative;z-index:6;width:min(320px,86vw);transition:transform .3s cubic-bezier(.3,.7,.3,1),box-shadow .3s}
  aside.lib{justify-self:start;transform:translateX(-110%)}
  aside.right{justify-self:end;transform:translateX(110%)}
  aside.open{transform:none;box-shadow:0 0 30px rgba(40,30,20,.18)}
  .lib-grid{grid-template-columns:1fr 1fr 1fr}
  .brand span,footer .only2d{display:none!important}
}
</style>

{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}}
</script>

<body>
<div class="app">
  <header>
    <div class="grp" id="paneBtns">
      <button class="btn chip" id="tgLib" data-en="◧ Library">◧ 家具库</button>
      <button class="btn chip" id="tgPanel" data-en="Properties ◨">属性 ◨</button>
    </div>
    
    <div class="brand"><b data-en="3BR 2LR 2BA · Interior Design">三室两厅两卫 · 装修设计</b><span id="subtitle">原始户型 1:60 · 尺寸单位 mm</span></div>
    <div class="grp seg" id="viewSeg" title="切换 2D / 3D (T)" data-en-title="Switch 2D / 3D (T)">
      <span class="pill"></span>
      <button class="btn" data-view="2d" data-en="2D Plan">2D 平面</button>
      <button class="btn" data-view="3d" data-en="3D Scene">3D 场景</button>
    </div>
    <div class="grp only2d" id="tools">
      <button class="btn on" data-tool="select" title="选择 / 移动 (V)" data-en-title="Select / Move (V)" data-en="Select">选择</button>
      <button class="btn" data-tool="measure" title="测量 (M)" data-en-title="Measure (M)" data-en="Measure">测量</button>
      <button class="btn" data-tool="demolish" title="拆改非承重墙 (X)" data-en-title="Demolish non-bearing walls (X)" data-en="Demolish">拆改墙体</button>
      <button class="btn" data-tool="wall" title="画墙 (W)" data-en-title="Draw wall (W)" data-en="Wall">画墙</button>
      <button class="btn" data-tool="win" title="画窗" data-en-title="Draw window" data-en="Window">画窗</button>
      <button class="btn" data-tool="door" title="画平开门" data-en-title="Draw swing door" data-en="Door">画门</button>
      <button class="btn" data-tool="slide" title="画推拉门" data-en-title="Draw sliding door" data-en="Slide">推拉门</button>
      <button class="btn" data-tool="room" title="画房间" data-en-title="Draw room" data-en="Room">画房间</button>
      <button class="btn" data-tool="calibrate" title="标定比例：点两点并输入已知长度" data-en-title="Calibrate scale: two points + known length" data-en="Scale">标定</button>
      <button class="btn" data-tool="mepLine" title="画管线：逐点折线，双击或 Enter 完成" data-en-title="Draw MEP polyline · double-click / Enter to finish" data-en="MEP line">画管线</button>
      <button class="btn" data-tool="mepNode" title="放置插座/电箱等节点" data-en-title="Place socket / panel node" data-en="MEP node">放节点</button>
    </div>
    <div class="grp only2d" id="mepTypeGrp" title="管线类型" data-en-title="MEP type">
      <button class="btn chip on" data-mep="power" data-en="Power">强电</button>
      <button class="btn chip" data-mep="weak" data-en="Weak">弱电</button>
      <button class="btn chip" data-mep="waterCold" data-en="Cold">冷水</button>
      <button class="btn chip" data-mep="waterHot" data-en="Hot">热水</button>
      <button class="btn chip" data-mep="heat" data-en="Heat">暖气</button>
      <button class="btn chip" data-mep="ac" data-en="AC">空调</button>
      <button class="btn primary" id="mepFinish" title="完成当前折线" data-en-title="Finish current polyline" data-en="Done">完成</button>
      <button class="btn" id="mepUndoPt" title="撤销上一个点" data-en-title="Undo last point" data-en="Undo pt">撤点</button>
    </div>
    <div class="grp only2d" id="mepNodeGrp" title="节点类型" data-en-title="Node type">
      <button class="btn chip on" data-mn="socket" data-en="Socket">五孔</button>
      <button class="btn chip" data-mn="fridge" data-en="Fridge">冰箱</button>
      <button class="btn chip" data-mn="splash" data-en="Splash">防溅</button>
      <button class="btn chip" data-mn="acSock" data-en="AC sock">空调插</button>
      <button class="btn chip" data-mn="data" data-en="Data">数据</button>
      <button class="btn chip" data-mn="tv" data-en="TV">电视</button>
      <button class="btn chip" data-mn="panel" data-en="Power box">强电箱</button>
      <button class="btn chip" data-mn="weakPanel" data-en="Weak box">弱电箱</button>
      <button class="btn chip" data-mn="acIn" data-en="AC in">内机</button>
      <button class="btn chip" data-mn="acOut" data-en="AC out">外机</button>
    </div>
    <div class="grp only2d">

function fixState(s){
  const d = defaultState();
  if (!s.geometry || !Array.isArray(s.geometry.walls)) s.geometry = cloneGeometry();
  else s.geometry = cloneGeometry(s.geometry);
  s.rooms = Object.assign(roomsMetaFromGeo(s.geometry.roomsDef), s.rooms || {});
  s.demolished = s.demolished || []; s.measures = s.measures || [];
  if (!s.mep || !Array.isArray(s.mep.runs) || !Array.isArray(s.mep.nodes)) s.mep = emptyMep();
  s.custom = !!s.custom;
  // underlay.src 可能很大：持久化时只保留元数据，src 会话内或 IndexedDB 恢复
  if (s.underlay && s.underlay.src === undefined) s.underlay.src = null;
  if (!s.underlay) s.underlay = null;

}

function refreshBounds(){
  const xs = [], ys = [];
  const pushRect = (a,b,c,d) => { xs.push(a,c); ys.push(b,d); };
  geoWalls().forEach(w => pushRect(w[0],w[1],w[2],w[3]));
  geoWins().forEach(w => pushRect(w[0],w[1],w[2],w[3]));
  geoDoors().forEach(d => pushRect(...d.rect));
  geoSlides().forEach(d => pushRect(...d.rect));
  geoRooms().forEach(r => r.poly.forEach(p => { xs.push(p[0]); ys.push(p[1]); }));
  if (state.underlay && state.underlay.wMm){
    const u = state.underlay;
    pushRect(u.ox, u.oy, u.ox + u.wMm, u.oy + u.hMm);
  }
  if (!xs.length){ BOUNDS = {x:-1000,y:-1000,w:12000,h:9000}; return BOUNDS; }
  const pad = 1500;
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  const x1 = Math.max(...xs) + pad, y1 = Math.max(...ys) + pad;
  BOUNDS = {x:x0, y:y0, w:x1-x0, h:y1-y0};
  return BOUNDS;
}

async function saveUnderlayToIDB(){
  if (!state.underlay?.src) return;
  try {
    const req = indexedDB.open(UNDERLAY_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('img');
    await new Promise((res, rej) => { req.onsuccess = res; req.onerror = rej; });
    const db = req.result;
    const tx = db.transaction('img', 'readwrite');
    tx.objectStore('img').put(state.underlay.src, 'current');
  } catch(e) {}
}
async function loadUnderlayFromIDB(){
  if (!state.underlay || state.underlay.src) return;
  try {
    const req = indexedDB.open(UNDERLAY_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('img');
    await new Promise((res, rej) => { req.onsuccess = res; req.onerror = rej; });
    const db = req.result;
    const tx = db.transaction('img', 'readonly');
    const g = tx.objectStore('img').get('current');
    const src = await new Promise((res, rej) => { g.onsuccess = () => res(g.result); g.onerror = rej; });
    if (src){ state.underlay.src = src; renderUnderlay(); }
  } catch(e) {}
}

function validateSel(){
  if (!ui.sel) return;
  const k = ui.sel.kind;
  if (k === 'furn' && !getF(ui.sel.id)) ui.sel = null;
  else if (k === 'room' && !geoRooms().find(r => r.id === ui.sel.id)) ui.sel = null;
  else if (k === 'wall' && !geoWalls()[ui.sel.i]) ui.sel = null;
  else if (k === 'win' && !geoWins()[ui.sel.i]) ui.sel = null;
  else if (k === 'door' && !geoDoors()[ui.sel.i]) ui.sel = null;
  else if (k === 'slide' && !geoSlides()[ui.sel.i]) ui.sel = null;
  else if (k === 'mepRun' && !ensureMep().runs.find(r => r.id === ui.sel.id)) ui.sel = null;
  else if (k === 'mepNode' && !ensureMep().nodes.find(n => n.id === ui.sel.id)) ui.sel = null;
}

/* ======================= 几何工具 ======================= */
const area = poly => Math.abs(poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2 / 1e6;
const perim = poly => poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + Math.hypot(q[0]-p[0], q[1]-p[1]); }, 0) / 1000;
const bbox = poly => { const xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]); return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; };
function aabb(f){ const a = f.rot*Math.PI/180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a)); return {hw:f.w/2*c + f.d/2*s, hh:f.w/2*s + f.d/2*c}; }
const fmt = (n, d=2) => n.toFixed(d);
const norm = a => ((Math.round(a) % 360) + 360) % 360;
function snapRects(){ return geoWalls().filter((w,i) => !state.demolished.includes('w'+i)).concat(geoWins()); }

function hex2rgb(h){ h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,k){ const f = v => Math.max(0,Math.min(255,Math.round(k>1 ? v+(255-v)*(k-1)*2 : v*k))); return '#'+hex2rgb(h).map(v=>f(v).toString(16).padStart(2,'0')).join(''); }

      <circle cx="420" cy="400" r="18" fill="#a88f76"/><circle cx="90" cy="440" r="12" fill="#8fa3a0"/><circle cx="440" cy="40" r="10" fill="#b9a58c"/></pattern>
    <pattern id="m-carpet" patternUnits="userSpaceOnUse" width="120" height="120">
      <rect width="120" height="120" fill="#c9c3d3"/><circle cx="30" cy="30" r="8" fill="#bab3c6"/><circle cx="90" cy="90" r="8" fill="#bab3c6"/></pattern>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="1000" height="1000">
      <path d="M500 0V1000M0 500H1000" stroke="#e5dfd3" stroke-width="8"/><path d="M0 0V1000M0 0H1000" stroke="#d8d0c1" stroke-width="14"/></pattern>`;
}

/* ======================= 家具图例 ======================= */
const ST = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
const rc = (x,y,w,h,f,ex='') => `<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" fill="${f}" ${ST} ${ex}/>`;
const ec = (cx,cy,rx,ry,f,ex='') => `<ellipse cx="${cx}" cy="${cy}" rx="${Math.max(0,rx)}" ry="${Math.max(0,ry)}" fill="${f}" ${ST} ${ex}/>`;
const ln = (x1,y1,x2,y2,ex='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${ST} ${ex}/>`;
const pa = (d,f='none',ex='') => `<path d="${d}" fill="${f}" ${ST} ${ex}/>`;
const DASH = 'stroke-dasharray="4 3"';

function furnSVG(t,w,d,c){
  const x = -w/2, y = -d/2, m = Math.min(w,d);
  switch (t){
    case 'bed': {
      let s = rc(x,y,w,d,'#fbf8f2','rx="30"') + rc(x,y,w,Math.min(90,d*.05),shade(c,.62),'rx="20"');
      const ph = Math.min(360,d*.18), py = y+150;
      if (w >= 1300){ const pw = (w-240)/2; s += rc(x+80,py,pw,ph,'#fff','rx="70"') + rc(x+160+pw,py,pw,ph,'#fff','rx="70"'); }
      else s += rc(x+80,py,w-160,ph,'#fff','rx="70"');
      const by = py+ph+110, bh = y+d-15-by;
      s += rc(x+15,by,w-30,bh,c,'rx="40"') + pa(`M${x+15} ${by+300}H${x+w-15}`,'none',DASH);
      s += pa(`M${x+w-15-Math.min(420,w*.3)} ${by}L${x+w-15} ${by}L${x+w-15} ${by+Math.min(420,w*.3)}Z`, shade(c,1.12));
      return s;
    }
    case 'sofa': case 'armchair': {
      const b = d*.24, a = Math.min(200,w*.13), n = t==='armchair' ? 1 : (w>2200 ? 3 : 2), cw = (w-2*a)/n, dk = shade(c,.85);
      let s = rc(x,y,w,d,dk,'rx="60"');
      for (let i=0;i<n;i++) s += rc(x+a+i*cw,y+b,cw,d-b-40,c,'rx="40"');
      return s + rc(x,y,w,b,dk,'rx="50"') + rc(x,y,a,d,dk,'rx="50"') + rc(x+w-a,y,a,d,dk,'rx="50"');
    }
    case 'cornersofa': {
      const k = Math.min(950,d*.56,w*.4), b = 220, dk = shade(c,.85);
      let s = pa(`M${x} ${y}H${x+w}V${y+k}H${x+k}V${y+d}H${x}Z`, dk);
      const cw = (w-b-200)/2;
      s += rc(x+b,y+b,cw,k-b-30,c,'rx="40"') + rc(x+b+cw,y+b,cw,k-b-30,c,'rx="40"') + rc(x+b,y+k,k-b-30,d-k-200,c,'rx="40"');
      return s + rc(x,y,w,b,dk,'rx="50"') + rc(x,y,b,d,dk,'rx="50"') + rc(x+w-200,y,200,k,dk,'rx="50"') + rc(x,y+d-200,k,200,dk,'rx="50"');
    }
    case 'nightstand': return rc(x,y,w,d,c,'rx="30"') + `<circle r="${m*.24}" fill="#fff6dd" ${ST}/>` + `<circle r="${m*.08}" fill="${shade(c,.8)}" ${ST}/>`;
    case 'wardrobe': {
      let s = rc(x,y,w,d,c) + ln(x+50,0,x+w-50,0);
      for (let hx = x+160; hx < x+w-100; hx += 180) s += ln(hx-45,-d*.28,hx+45,d*.28,'opacity=".6"');
      return s;
    }
    case 'cabinet': case 'shoecab': return rc(x,y,w,d,c) + ln(x,y+d,x+w,y);
    case 'dresser': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.2,y,w*.6,55,'#dfe9ee') + ec(0,d/2+180,160,140,shade(c,.9));
    case 'desk': return rc(x,y,w,d,c,'rx="20"') + rc(-w*.18,y+50,w*.36,45,'#555') + rc(-w*.14,y+d*.45,w*.28,d*.28,'#f4f4f4','rx="10"');
    case 'chair': return rc(x+25,y+d*.16,w-50,d*.84-10,c,'rx="60"') + rc(x,y,w,d*.2,shade(c,.78),'rx="40"');
    case 'bookshelf': { let s = rc(x,y,w,d,c); for (let bx = x+400; bx < x+w-50; bx += 400) s += ln(bx,y,bx,y+d); return s; }
    case 'baycushion': return rc(x,y,w,d,c,'rx="60"') + rc(x+60,y+80,w-120,Math.min(300,d*.2),'#fff','rx="60"') + rc(x+60,y+d-80-Math.min(300,d*.2),w-120,Math.min(300,d*.2),'#fff','rx="60"');
    case 'coffeetable': return rc(x,y,w,d,c,'rx="80"') + rc(x+60,y+60,w-120,d-120,shade(c,1.06),'rx="50"');
    case 'tvstand': return rc(x,y,w,d,c) + rc(x+w*.15,y+30,w*.7,55,'#3a3a3a');
    case 'rug': return rc(x,y,w,d,c,'rx="40" fill-opacity=".6"') + rc(x+90,y+90,w-180,d-180,'none','rx="30" stroke-dasharray="3 3" opacity=".6"');
    case 'plant': {
      let s = `<circle r="${m/2}" fill="${c}" fill-opacity=".85" ${ST}/>`;
      for (let k=0;k<8;k++) s += `<ellipse cx="0" cy="${-m*.27}" rx="${m*.1}" ry="${m*.21}" transform="rotate(${k*45})" fill="${shade(c,.8)}" ${ST}/>`;
      return s + `<circle r="${m*.1}" fill="#8a6a4a" ${ST}/>`;
    }
    case 'table': return rc(x,y,w,d,c,'rx="30"') + rc(x+50,y+50,w-100,d-100,'none','rx="20" opacity=".4"');
    case 'roundtable': return ec(0,0,w/2,d/2,c) + ec(0,0,w/2-50,d/2-50,'none','opacity=".4"');
    case 'counter': return rc(x,y,w,d,c) + ln(x,y+d-40,x+w,y+d-40,DASH);
    case 'stove': {
      let s = rc(x,y,w,d,'#2f2f2f','rx="20"'); const r = m*.26;
      const pts = w/d > 1.4 ? [[-w/4,0],[w/4,0]] : [[-w/4,-d/4],[w/4,-d/4],[-w/4,d/4],[w/4,d/4]];
      pts.forEach(([px,py]) => s += `<circle cx="${px}" cy="${py}" r="${r}" fill="none" stroke="#bbb" stroke-width="1" vector-effect="non-scaling-stroke"/><circle cx="${px}" cy="${py}" r="${r*.45}" fill="#666"/>`);
      return s;
    }
    case 'ksink': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.06,y+d*.18,w*.42,d*.66,'#fff','rx="50"') + rc(x+w*.52,y+d*.18,w*.42,d*.66,'#fff','rx="50"') + `<circle cx="0" cy="${y+d*.09}" r="22" fill="#999"/>`;
    case 'fridge': return rc(x,y,w,d,c,'rx="30"') + ln(x,y+d*.14,x+w,y+d*.14) + ln(0,y+d*.14,0,y+d) + rc(-70,y+d*.5,40,d*.25,'#aab') + rc(30,y+d*.5,40,d*.25,'#aab');
    case 'toilet': return rc(x+w*.04,y,w*.92,d*.27,c,'rx="30"') + ec(0,y+d*.27+d*.36,w*.47,d*.36,c) + ec(0,y+d*.27+d*.4,w*.3,d*.24,'#eef4f7');
    case 'vanity': return rc(x,y,w,d,c,'rx="20"') + ec(0,y+d*.57,Math.min(w*.32,260),d*.28,'#fff') + `<circle cx="0" cy="${y+d*.17}" r="26" fill="#999"/>`;
    case 'shower': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d,DASH) + ln(x+w,y,x,y+d,DASH) + `<circle r="45" fill="#fff" ${ST}/>`;
    case 'bathtub': return rc(x,y,w,d,c,'rx="40"') + rc(x+80,y+80,w-160,d-160,'#fff',`rx="${m*.33}"`) + `<circle cx="${x+w-260}" cy="0" r="35" fill="#ccc" ${ST}/>`;
    case 'washer': case 'dryer': return rc(x,y,w,d,c,'rx="30"') + rc(x,y,w,d*.14,shade(c,.9)) + `<circle cy="${d*.06}" r="${m*.34}" fill="#fff" ${ST}/><circle cy="${d*.06}" r="${m*.24}" fill="${t==='dryer'?'#e9dccb':'#cfdde4'}" ${ST}/>`;
    case 'crib': {
      let s = rc(x,y,w,d,c,'rx="20"') + rc(x+45,y+45,w-90,d-90,'#fff','rx="20"');
      for (let sx = x+90; sx < x+w-60; sx += 90) s += ln(sx,y,sx,y+45,'opacity=".5"') + ln(sx,y+d-45,sx,y+d,'opacity=".5"');
      return s;
    }
    case 'beanbag': return ec(0,0,w/2,d/2,c) + ec(-w*.04,-d*.06,w*.3,d*.28,shade(c,1.12),'opacity=".9"');
    case 'sidetable': return ec(0,0,w/2,d/2,c) + ec(0,0,w*.12,d*.12,'none','opacity=".5"');
    case 'floorlamp': return `<circle r="${m*.5}" fill="#fff6dd" fill-opacity=".85" ${ST}/>` + `<circle r="${m*.32}" fill="none" ${ST} ${DASH}/>` + `<circle r="${m*.07}" fill="${c}" ${ST}/>`;
    case 'island': return rc(x,y,w,d,c) + ln(x,y+d-250,x+w,y+d-250,DASH);
    case 'barstool': return `<circle r="${m/2}" fill="${c}" ${ST}/><circle r="${m*.3}" fill="${shade(c,1.15)}" ${ST}/>`;
    case 'waterheater': return rc(x,y,w,d,c,`rx="${d/2}" ${DASH}`) + ln(x+w*.2,0,x+w*.8,0,DASH);
    case 'tv': return rc(x,y,w,d,c,'rx="10"') + rc(x+w*.3,y+d,w*.4,Math.min(40,d),'#666');
    case 'aircon': return rc(x,y,w,d,c,'rx="30"') + ln(x+40,y+d*.72,x+w-40,y+d*.72) + ln(x+40,y+d*.86,x+w-40,y+d*.86);
    case 'acwall': {
      let s = rc(x,y,w,d,c,`rx="30" ${DASH}`);
      [.25,.5,.75].forEach(k => s += ln(x+w*k,y+d,x+w*k,y+d+200,`${DASH} opacity=".6"`));
      return s;
    }
    case 'dishwasher': return rc(x,y,w,d,c,'rx="15"') + ln(x,y+d-70,x+w,y+d-70) + rc(x+w*.3,y+d-45,w*.4,25,'#888');
    case 'ovencol': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d) + ln(x+w,y,x,y+d);
    case 'purifier': return rc(x,y,w,d,c,'rx="60"') + rc(x+45,y+45,w-90,d-90,'none',`rx="40" ${DASH}`);
    case 'officechair': {
      let s = '';
      for (let k = 0; k < 5; k++) s += `<line x1="0" y1="0" x2="0" y2="${m*.48}" transform="rotate(${k*72+36})" stroke="#555" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
      return s + rc(x+w*.12,y+d*.22,w*.76,d*.66,c,'rx="80"') + rc(x+w*.15,y+d*.04,w*.7,d*.16,shade(c,.78),'rx="40"')
        + rc(x+w*.02,y+d*.3,w*.1,d*.45,shade(c,.7),'rx="30"') + rc(x+w*.88,y+d*.3,w*.1,d*.45,shade(c,.7),'rx="30"');
    }
    case 'piano': {
      let s = rc(x,y,w,d*.55,c,'rx="10"') + rc(x+40,y+d*.55,w-80,d*.4,shade(c,1.4),'rx="10"');
      const kx = x+90, kw = w-180, kd = d*.2;
      s += rc(kx,y+d*.55,kw,kd,'#faf8f3');
      for (let i = 1; i < 26; i++) s += ln(kx+kw*i/26,y+d*.55,kx+kw*i/26,y+d*.55+kd,'opacity=".5"');
      return s;
    }
    case 'treadmill': return rc(x,y,w,d,c,'rx="50"') + rc(x+90,y+320,w-180,d-400,'#1c1c1e','rx="25"') + rc(x,y,w,230,shade(c,1.4),'rx="40"');
    default: return rc(x,y,w,d,c);
  }
}

/* ======================= 渲染 ======================= */
const NOLABEL = ['plant','floorlamp','sidetable','barstool','beanbag'];
function renderRooms(){
  let s = '';
  geoRooms().forEach(r => {
    const mat = state.rooms[r.id]?.mat || r.mat || 'tile800';
    s += `<polygon class="room" data-room="${r.id}" points="${r.poly.map(p=>p.join(',')).join(' ')}" fill="url(#m-${mat})"/>`;
  });
  const sill = (rect, attrs='') => { const [a,b,c,d]=rect; return `<rect x="${a}" y="${b}" width="${c-a}" height="${d-b}" fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke" ${attrs}/>`; };
  geoDoors().forEach((d,i) => s += sill(d.rect, `class="door-hit" data-door="${i}" style="pointer-events:all;cursor:pointer"`));
  geoSlides().forEach((d,i) => s += sill(d.rect, `class="slide-hit" data-slide="${i}" style="pointer-events:all;cursor:pointer"`));
  $('#gRooms').innerHTML = s;
}

function renderFurn(){
  const g = $('#gFurn');
  g.setAttribute('display', ui.layers.furn ? 'inline' : 'none');
  g.innerHTML = state.furniture.map(f => {
    const fs = Math.max(80, Math.min(170, Math.min(f.w,f.d)*.2));
    const label = Math.min(f.w,f.d) >= 380 && !NOLABEL.includes(f.type)
      ? `<text transform="rotate(${-f.rot})" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#4a443c" opacity=".8" pointer-events="none">${esc(nm(f.name))}</text>` : '';
    return `<g class="furn" data-fid="${f.id}" transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">${furnSVG(f.type,f.w,f.d,f.color)}${label}</g>`;
  }).join('');
}

function renderWalls(){
  $('#gWalls').innerHTML = geoWalls().map((w,i) => {
    const [x0,y0,x1,y1,k] = w, id = 'w'+i, dem = state.demolished.includes(id);
    let fill = k==='b' ? (ui.layers.bearing ? '#b8412c' : '#26241f') : k==='low' ? '#e9e3d8' : k==='e' ? '#8f897d' : '#a7a195';
    let ex = k==='low' ? 'stroke="#8f897d" stroke-width="1" vector-effect="non-scaling-stroke"' : '';
    if (dem){ fill = 'rgba(198,91,58,.12)'; ex = 'stroke="#c65b3a" stroke-width="1.2" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"'; }
    return `<rect class="wall" data-wall="${id}" data-wi="${i}" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${fill}" ${ex}/>`;
  }).join('');
}

function renderOpenings(){
  const WS = 'stroke="#4f7394" stroke-width="1" vector-effect="non-scaling-stroke"';
  let s = '';
  geoWins().forEach((win, i) => {
    const [x0,y0,x1,y1] = win;
    const w = x1-x0, h = y1-y0;
    s += `<rect class="win" data-win="${i}" x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#f7fbfd" ${WS} style="pointer-events:all;cursor:pointer"/>`;
    if (w >= h) [1/3,2/3].forEach(t => s += `<line x1="${x0}" y1="${y0+h*t}" x2="${x1}" y2="${y0+h*t}" ${WS} pointer-events="none"/>`);
    else [1/3,2/3].forEach(t => s += `<line x1="${x0+w*t}" y1="${y0}" x2="${x0+w*t}" y2="${y1}" ${WS} pointer-events="none"/>`);
  });
  const DS = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
  geoDoors().forEach(d => {
    const [hx,hy] = d.h, L = d.len, T = 40;
    const ox = hx + d.o[0]*L, oy = hy + d.o[1]*L, cx = hx + d.c[0]*L, cy = hy + d.c[1]*L;
    const sweep = d.o[0]*d.c[1] - d.o[1]*d.c[0] > 0 ? 1 : 0;
    const col = d.entry ? '#b5653a' : '#3d3a34';
    s += `<polygon points="${hx},${hy} ${ox},${oy} ${ox+d.c[0]*T},${oy+d.c[1]*T} ${hx+d.c[0]*T},${hy+d.c[1]*T}" fill="#fff" stroke="${col}" stroke-width="${d.entry?1.8:1}" vector-effect="non-scaling-stroke"/>`;
    s += `<path d="M${ox} ${oy}A${L} ${L} 0 0 ${sweep} ${cx} ${cy}" fill="none" ${DS} stroke-dasharray="5 3" opacity=".7"/>`;
  });
  geoSlides().forEach(({rect:[x0,y0,x1,y1],v}) => {
    if (v){ const L = y1-y0, m = (x0+x1)/2; s += `<rect x="${m-45}" y="${y0}" width="40" height="${L*.55}" fill="#fff" ${DS}/><rect x="${m+5}" y="${y1-L*.55}" width="40" height="${L*.55}" fill="#fff" ${DS}/>`; }
    else { const L = x1-x0, m = (y0+y1)/2; s += `<rect x="${x0}" y="${m-45}" width="${L*.55}" height="40" fill="#fff" ${DS}/><rect x="${x1-L*.55}" y="${m+5}" width="${L*.55}" height="40" fill="#fff" ${DS}/>`; }
  });
  // 入户标识
  if (!state.custom) s += `<path d="M3350 8755H4350M4150 8600L4400 8755L4150 8910" fill="none" stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <text x="3380" y="8600" font-size="200" fill="#b5653a">${tr('入户','Entry')}</text>`;
  $('#gOpen').innerHTML = s;
}

function renderLabels(){
  const g = $('#gLabels');
  g.setAttribute('display', ui.layers.labels ? 'inline' : 'none');
  g.innerHTML = geoRooms().filter(r => r.at).map(r => {
    const [x,y] = r.at, halo = 'stroke="#fbf9f4" stroke-width="45" paint-order="stroke" stroke-linejoin="round"';
    const name = state.rooms[r.id]?.name || r.name || '';
    return `<text x="${x}" y="${y}" font-size="250" font-weight="600" text-anchor="middle" fill="#2b2824" ${halo}>${esc(nm(name))}</text>
      <text x="${x}" y="${y+260}" font-size="175" text-anchor="middle" fill="#7d7366" ${halo}>${fmt(area(r.poly))} m²</text>`;
  }).join('');
}

function renderDims(){
  const g = $('#gDims');
  if (state.custom){ g.innerHTML = ''; g.setAttribute('display', 'none'); return; }
  const DC = '#7d7160', LS = `stroke="${DC}" stroke-width="1" vector-effect="non-scaling-stroke"`, TK = `stroke="${DC}" stroke-width="2" vector-effect="non-scaling-stroke"`;
  const txt = (x,y,v,rot) => `<text x="${x}" y="${y}" font-size="${v<400?140:200}" text-anchor="middle" fill="${DC}" ${rot?`transform="rotate(-90 ${x} ${y})"`:''}>${v}</text>`;
  const chain = (horiz, at, start, segs) => {
    const pts = [start]; segs.forEach(v => pts.push(pts[pts.length-1]+v));
    let s = horiz ? `<line x1="${pts[0]}" y1="${at}" x2="${pts.at(-1)}" y2="${at}" ${LS}/>` : `<line x1="${at}" y1="${pts[0]}" x2="${at}" y2="${pts.at(-1)}" ${LS}/>`;
    pts.forEach(p => s += horiz
      ? `<line x1="${p}" y1="${at-170}" x2="${p}" y2="${at+170}" ${LS}/><line x1="${p-80}" y1="${at+80}" x2="${p+80}" y2="${at-80}" ${TK}/>`
      : `<line x1="${at-170}" y1="${p}" x2="${at+170}" y2="${p}" ${LS}/><line x1="${at-80}" y1="${p+80}" x2="${at+80}" y2="${p-80}" ${TK}/>`);
    segs.forEach((v,i) => { const mid = (pts[i]+pts[i+1])/2; s += horiz ? txt(mid, at-70, v) : txt(at-70, mid, v, true); });
    return s;
  };
  g.innerHTML =
    chain(true,-750,0,[1580,240,2760,240,1540,240,3670]) + chain(true,-1250,0,[10270]) +
    chain(true,11350,0,[2180,240,2160,240,5450,240,1340]) + chain(true,11850,0,[11850]) +
    chain(false,-800,0,[3370,1580,240,2770,240,2360]) + chain(false,-1300,0,[10560]) +
    chain(false,12750,0,[3370,240,2760,240,3950]) + chain(false,13250,0,[10560]);
  g.setAttribute('display', ui.layers.dims ? 'inline' : 'none');
}

function renderGrid(){
  $('#gGrid').innerHTML = `<rect x="-20000" y="-20000" width="55000" height="55000" fill="${ui.layers.grid ? 'url(#grid)' : 'transparent'}" data-bg="1"/>`;
}

function renderUnderlay(){
  const g = $('#gUnderlay');
  const u = state.underlay;
  if (!u || !u.src || !ui.layers.underlay){ g.innerHTML = ''; return; }
  const op = (u.opacity != null ? u.opacity : 0.45);
  g.innerHTML = `<image href="${u.src}" x="${u.ox}" y="${u.oy}" width="${u.wMm}" height="${u.hMm}" opacity="${op}" preserveAspectRatio="none"/>`;
  const slider = $('#underlayOp');
  if (slider) slider.value = Math.round(op * 100);
}

function renderDraft(){
  const g = $('#gDraft'); if (!g) return;
  const k = 1/view.s;
  let s = '';
  if (ui.cal?.a){
    const a = ui.cal.a, b = ui.cal.b || ui.cal.cur;
    s += `<circle cx="${a.x}" cy="${a.y}" r="${4*k}" fill="#2f5d62"/>`;

function renderMeasure(){
  const k = 1/view.s, fs = 12*k;
  const one = (a,b,tmp) => {
    const L = Math.hypot(b.x-a.x, b.y-a.y); if (L < 1) return '';
    let ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI; if (ang > 90 || ang < -90) ang += 180;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, nx = -(b.y-a.y)/L*5*k, ny = (b.x-a.x)/L*5*k;
    const col = tmp ? '#2f5d62' : '#b5653a', S = `stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"`;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${S}/>
      <line x1="${a.x-nx}" y1="${a.y-ny}" x2="${a.x+nx}" y2="${a.y+ny}" ${S}/><line x1="${b.x-nx}" y1="${b.y-ny}" x2="${b.x+nx}" y2="${b.y+ny}" ${S}/>
      <text x="${mx}" y="${my-5*k}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="600" transform="rotate(${ang} ${mx} ${my})"
        stroke="#fff" stroke-width="${3.5*k}" paint-order="stroke">${Math.round(L)} mm</text>`;
  };
  let s = state.measures.map(m => one(m.a,m.b)).join('');
  if (ui.mA && ui.mCur) s += one(ui.mA, ui.mCur, true);
  if (ui.mA) s += `<circle cx="${ui.mA.x}" cy="${ui.mA.y}" r="${3*k}" fill="#2f5d62"/>`;

}

let _mepN = 1;
const mepUid = (p='m') => p + Date.now().toString(36) + (_mepN++);
function ensureMep(){ if (!state.mep) state.mep = emptyMep(); return state.mep; }
function mepRoomNameOf(r){ return state.rooms[r.id]?.name || r.name || ''; }
function mepKindOf(r){
  const n = mepRoomNameOf(r), mat = state.rooms[r.id]?.mat || r.mat || '';
  if (/卫|浴|厕|bath|toilet/i.test(n) || mat === 'antislip') return 'bath';
  if (/厨|kitchen/i.test(n) || mat === 'tile600') return 'kitchen';
  if (/洗衣|laundry/i.test(n)) return 'laundry';
  if (/过道|玄关|走廊|hall|corridor/i.test(n)) return 'hall';
  if (/客|餐|living|dining/i.test(n) || mat === 'tile800') return 'living';
  if (/阳台|balcon/i.test(n) || mat === 'walnut') return 'balcony';
  if (/卧|房|床|bed|kid|child|master|书房/i.test(n) || mat === 'wood') return 'bedroom';
  return 'other';
}
function mepPtOf(r){
  if (r.at) return [r.at[0], r.at[1]];
  const b = bbox(r.poly); return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
}
function mepDedupeXy(pts){
  const out = [];
  for (const p of pts){
    const last = out[out.length - 1];
    if (!last || Math.hypot(p[0] - last[0], p[1] - last[1]) > 40) out.push([Math.round(p[0]), Math.round(p[1])]);
  }
  return out;
}
function mepRouteXy(a, b, hub){
  if (!hub) return mepDedupeXy([a, [b[0], a[1]], b]);
  return mepDedupeXy([a, [hub[0], a[1]], hub, [hub[0], b[1]], b]);
}
function mepFloorLoopXy(aabb, inset = 380){
  let [x0, y0, x1, y1] = aabb;
  x0 += inset; y0 += inset; x1 -= inset; y1 -= inset;
  if (x1 - x0 < 700 || y1 - y0 < 700) return null;
  const pts = [[x0, y0]], step = Math.max(450, Math.min(700, (y1 - y0) / 5));
  let y = y0, left = true;
  while (y < y1 - 80){
    pts.push(left ? [x1, y] : [x0, y]);
    y += step;
    if (y >= y1) break;
    pts.push(left ? [x1, y] : [x0, y]);
    left = !left;
  }
  pts.push(left ? [x0, Math.min(y, y1)] : [x1, Math.min(y, y1)]);
  return mepDedupeXy(pts);
}
function mepWallSockets(r, inset = 280){
  const [x0, y0, x1, y1] = bbox(r.poly);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return {
    N: [cx, y0 + inset], S: [cx, y1 - inset], W: [x0 + inset, cy], E: [x1 - inset, cy],
    NW: [x0 + inset, y0 + inset], NE: [x1 - inset, y0 + inset],
    SW: [x0 + inset, y1 - inset], SE: [x1 - inset, y1 - inset],
  };
}
function mepAddRun(type, pts){
  const clean = mepDedupeXy(pts);
  if (clean.length < 2) return null;
  const run = {id: mepUid('r'), type, pts: clean};
  ensureMep().runs.push(run);
  return run;
}
function mepAddNode(kind, x, y){
  const n = {id: mepUid('n'), kind, x: Math.round(x), y: Math.round(y)};
  ensureMep().nodes.push(n);
  return n;
}
function mepOrthoPoint(prev, p, forceOrtho = true){
  if (!forceOrtho || !prev) return {x: Math.round(p.x / 50) * 50, y: Math.round(p.y / 50) * 50};
  const dx = Math.abs(p.x - prev[0]), dy = Math.abs(p.y - prev[1]);
  if (dx >= dy) return {x: Math.round(p.x / 50) * 50, y: prev[1]};
  return {x: prev[0], y: Math.round(p.y / 50) * 50};
}
/** 按装修强/弱电工程图风格自动生成可编辑管线 */
function autoGenerateMep(replace = true){
  const mep = ensureMep();
  if (replace){ mep.runs = []; mep.nodes = []; }
  const rooms = geoRooms().filter(r => r.counted !== false && r.poly?.length >= 3);
  const b = BOUNDS;
  if (!rooms.length){
    const m = 800, loop = [[b.x+m,b.y+m],[b.x+b.w-m,b.y+m],[b.x+b.w-m,b.y+b.h-m],[b.x+m,b.y+b.h-m],[b.x+m,b.y+m]];
    mepAddRun('power', loop);
    mepAddRun('weak', loop.map(([x,y]) => [x+120, y+120]));
    mepAddNode('panel', b.x + b.w/2, b.y + b.h/2);
    return mep;
  }
  const kinds = Object.fromEntries(rooms.map(r => [r.id, mepKindOf(r)]));
  const hall = rooms.find(r => kinds[r.id] === 'hall') || rooms.find(r => kinds[r.id] === 'living') || rooms[0];
  const hub = mepPtOf(hall);
  const kitchen = rooms.find(r => kinds[r.id] === 'kitchen');
  const living = rooms.find(r => kinds[r.id] === 'living');
  const balcony = rooms.find(r => kinds[r.id] === 'balcony' || kinds[r.id] === 'laundry');
  const entry = geoDoors().find(d => d.entry) || geoDoors()[0];
  const entryPt = entry
    ? [(entry.rect[0]+entry.rect[2])/2, (entry.rect[1]+entry.rect[3])/2]
    : hub;
  // 电箱：过道靠近入户
  const panel = mepAddNode('panel', (hub[0]*2 + entryPt[0])/3, (hub[1]*2 + entryPt[1])/3);
  const weakP = mepAddNode('weakPanel', panel.x + 350, panel.y + 80);
  const panelPt = [panel.x, panel.y], weakPt = [weakP.x, weakP.y];

  const powerEnds = [], weakEnds = [], wetEnds = [];
  for (const r of rooms){
    const k = kinds[r.id], w = mepWallSockets(r);
    if (k === 'balcony') continue;
    if (k === 'bedroom'){
      powerEnds.push(mepAddNode('socket', ...w.W), mepAddNode('socket', ...w.E), mepAddNode('acSock', ...w.N));
      weakEnds.push(mepAddNode('data', ...w.S));
      mepAddNode('acIn', ...w.NE);
    } else if (k === 'living'){
      powerEnds.push(mepAddNode('socket', ...w.S), mepAddNode('socket', ...w.W), mepAddNode('acSock', ...w.N));
      weakEnds.push(mepAddNode('tv', ...w.N), mepAddNode('data', ...w.E));
      mepAddNode('acIn', ...w.NW);
    } else if (k === 'kitchen'){
      powerEnds.push(mepAddNode('splash', ...w.N), mepAddNode('fridge', ...w.E), mepAddNode('socket', ...w.W));
      wetEnds.push([w.N[0], w.N[1]], [w.W[0], w.W[1]]);
    } else if (k === 'bath' || k === 'laundry'){
      powerEnds.push(mepAddNode('splash', ...w.W));
      wetEnds.push([w.E[0], w.E[1]], [w.S[0], w.S[1]]);
    } else if (k === 'hall'){
      powerEnds.push(mepAddNode('socket', ...w.S));
    } else {
      powerEnds.push(mepAddNode('socket', ...w.S));
    }
  }
  for (const f of state.furniture || []){
    if (f.type === 'fridge') powerEnds.push(mepAddNode('fridge', f.cx, f.cy));
    if (f.type === 'tv') weakEnds.push(mepAddNode('tv', f.cx, f.cy));
    if (f.type === 'acwall' || f.type === 'aircon'){
      powerEnds.push(mepAddNode('acSock', f.cx, f.cy));
      mepAddNode('acIn', f.cx, f.cy - 200);
    }
    if (WET_FURN_TYPES.has(f.type)) wetEnds.push([f.cx, f.cy]);
  }
  if (balcony){
    const w = mepWallSockets(balcony);
    mepAddNode('acOut', ...w.E);
    mepAddRun('ac', mepRouteXy(panelPt, w.E, hub));
  } else if (living){
    const w = mepWallSockets(living, 200);
    mepAddNode('acOut', w.E[0] + 400, w.E[1]);
  }

  // 强电：箱 → 各插座（正交折线，带轻微岔口）
  for (const n of powerEnds){
    const path = mepRouteXy(panelPt, [n.x, n.y], hub);
    // 末端岔口：最后一节拐一点再落到插座，贴近工程图分支感
    if (path.length >= 2){
      const a = path[path.length - 2], b = path[path.length - 1];
      const mid = [Math.round((a[0]+b[0])/2), Math.round((a[1]+b[1])/2)];
      path.splice(path.length - 1, 0, mid);
    }
    mepAddRun('power', path);
  }
  for (const n of weakEnds){
    mepAddRun('weak', mepRouteXy(weakPt, [n.x, n.y], hub));
  }

  // 水暖
  const plantRoom = kitchen || rooms.find(r => ['bath','laundry'].includes(kinds[r.id])) || hall;
  const plant = mepPtOf(plantRoom);
  const wetRooms = rooms.filter(r => ['bath','kitchen','laundry'].includes(kinds[r.id]));
  if (!wetRooms.length) wetRooms.push(...rooms.filter(r => !['bedroom','balcony'].includes(kinds[r.id])).slice(0, 2));
  for (const r of wetRooms){
    const w = mepWallSockets(r, 320);
    wetEnds.push(w.N, w.E);
  }
  for (const pt of wetEnds){
    mepAddRun('waterCold', mepRouteXy(plant, pt, hub).map(([x,y],i) => [x+(i?50:0), y+(i?30:0)]));
    mepAddRun('waterHot', mepRouteXy(plant, pt, hub).map(([x,y],i) => [x-(i?50:0), y-(i?30:0)]));
  }
  const heated = rooms.filter(r => ['bedroom','living','hall','other'].includes(kinds[r.id]));
  for (const r of (heated.length ? heated : rooms)){
    const loop = mepFloorLoopXy(bbox(r.poly));
    if (!loop) continue;
    mepAddRun('heat', mepRouteXy(plant, loop[0], hub));
    mepAddRun('heat', loop);
  }
  return mep;
}

    ${sel ? `<circle r="${5*k}" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke" pointer-events="none"/>` : ''}</g>`;

function mepDistToSeg(px, py, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx*dx + dy*dy;
  if (L2 < 1) return Math.hypot(px - a[0], py - a[1]);
  let t = ((px - a[0]) * dx + (py - a[1]) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a[0] + t * dx), py - (a[1] + t * dy));
}
/** 几何拾取：点击空白处时找最近管线/节点（不依赖 SVG hit） */
function pickMepAt(x, y, tolMm){
  const mep = ensureMep();
  const tol = tolMm ?? Math.max(150, 12 / view.s);
  let bestN = null, bestNd = tol;
  for (const n of mep.nodes){
    if (!mepLayerVisible(n.kind)) continue;
    const d = Math.hypot(x - n.x, y - n.y);
    if (d < bestNd){ bestNd = d; bestN = n; }
  }
  if (bestN) return {kind:'mepNode', id:bestN.id};
  let bestR = null, bestRd = tol;
  for (const run of mep.runs){
    if (!mepLayerVisible(run.type) || !run.pts || run.pts.length < 2) continue;
    for (let i = 0; i < run.pts.length - 1; i++){
      const d = mepDistToSeg(x, y, run.pts[i], run.pts[i + 1]);
      if (d < bestRd){ bestRd = d; bestR = run; }
    }
  }
  if (bestR) return {kind:'mepRun', id:bestR.id};
  return null;
}
function renderMep(){
  const g = $('#gMep');
  if (!g) return;
  const show = ui.layers.elec || ui.layers.water || ui.layers.heat;
  syncMepLayerBtns();
  const mep = ensureMep();
  // 画线中即使图层暂时关也要显示预览
  const drawing = ui.draw?.preview?.type === 'mepPoly';
  if (!show && !drawing){ g.innerHTML = ''; return; }
  const sk = 1 / view.s;
  let html = '';
  if (show) for (const run of mep.runs){
    if (!mepLayerVisible(run.type) || !run.pts || run.pts.length < 2) continue;
    const meta = MEP_META[run.type] || MEP_META.power;
    const sel = ui.sel?.kind === 'mepRun' && ui.sel.id === run.id;
    const d = run.pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');
    // 粗透明命中条 + 可见线（屏幕像素宽度，缩放不变）
    html += `<path class="mep-hit" data-mep-run="${run.id}" d="${d}" fill="none" stroke="transparent" stroke-width="14"
      stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    html += `<path data-mep-run="${run.id}" d="${d}" fill="none" stroke="${meta.color}" stroke-width="${sel ? 5 : 3.5}"
      stroke-linecap="round" stroke-linejoin="round" opacity="${sel ? .98 : .88}" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
    if (sel){
      run.pts.forEach((p, i) => {
        html += `<circle class="mep-vert" data-mep-vert="${run.id}:${i}" cx="${p[0]}" cy="${p[1]}" r="${7*sk}" fill="#fff" stroke="${meta.color}"
          stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
      });
    }
  }
  if (show) for (const n of mep.nodes){
    if (!mepLayerVisible(n.kind)) continue;
    html += mepNodeSVG(n, sk);
  }
  if (drawing){
    const p = ui.draw.preview, meta = MEP_META[p.mepType] || MEP_META.power;
    const pts = p.pts.concat(p.cur ? [[p.cur.x, p.cur.y]] : []);
    if (pts.length >= 2){
      const d = pts.map((q, i) => `${i ? 'L' : 'M'}${q[0]},${q[1]}`).join(' ');
      html += `<path d="${d}" fill="none" stroke="${meta.color}" stroke-width="4" stroke-dasharray="10 8" opacity=".85" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
    }
    pts.forEach(q => html += `<circle cx="${q[0]}" cy="${q[1]}" r="${6*sk}" fill="${meta.color}" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke" pointer-events="none"/>`);
  }
  g.innerHTML = html;
}
function finishMepPoly(){
  const p = ui.draw?.preview;
  if (!p || p.type !== 'mepPoly'){ ui.draw = null; renderMep(); return; }
  // 把当前橡皮筋点一并收进折线
  if (p.cur && p.pts.length){
    const last = p.pts[p.pts.length - 1];
    if (Math.hypot(p.cur.x - last[0], p.cur.y - last[1]) > 40) p.pts.push([p.cur.x, p.cur.y]);
  }
  if (p.pts.length < 2){
    toast(tr('至少点击两个点再完成（或点「完成」）', 'Need at least two points before finishing'));
    return;
  }
  const type = p.mepType || ui.mepType;
  let newId = null;
  mutate(() => { newId = mepAddRun(type, p.pts)?.id; });
  ui.draw = null;
  enableMepLayers(true);
  if (newId) select({kind:'mepRun', id: newId});
  else renderMep();
  toast(tr(`已添加${MEP_META[type]?.label || ''}管线 · 可选中后拖白点修改`, `Added ${MEP_META[type]?.en || ''} run · drag vertices to edit`));
}

function deleteSel(){

// 新放下的家具若压在墙 / 窗上，沿穿透较浅的方向推出来，刚好贴墙
function pushOut(f){
  for (let n = 0; n < 4; n++){
    let moved = false;
    for (const r of snapRects()){
      const {hw, hh} = aabb(f), ox = Math.min(f.cx+hw, r[2]) - Math.max(f.cx-hw, r[0]), oy = Math.min(f.cy+hh, r[3]) - Math.max(f.cy-hh, r[1]);
      if (ox <= 0 || oy <= 0) continue;
      if (ox < oy) f.cx = f.cx < (r[0]+r[2])/2 ? r[0]-hw : r[2]+hw;
      else f.cy = f.cy < (r[1]+r[3])/2 ? r[1]-hh : r[3]+hh;
      moved = true;
    }
    if (!moved) return;
  }
}

function normRect(x0,y0,x1,y1){
  return [Math.min(x0,x1), Math.min(y0,y1), Math.max(x0,x1), Math.max(y0,y1)];
}
function makeDoorFromRect(rect, hingeCorner, openDir){
  // hingeCorner: 0=TL 1=TR 2=BR 3=BL; openDir: inward normal-ish as [dx,dy] unit along open
  const [x0,y0,x1,y1] = rect;
  const w = x1-x0, h = y1-y0, horiz = w >= h;
  const corners = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
  const hpt = corners[hingeCorner];
  let c, o, len;
  if (horiz){
    // door leaf swings in Y
    len = w;
    const along = hingeCorner === 0 || hingeCorner === 3 ? [1,0] : [-1,0];
    c = along;
    o = openDir; // [0,1] or [0,-1]
  } else {
    len = h;
    const along = hingeCorner === 0 || hingeCorner === 1 ? [0,1] : [0,-1];
    c = along;
    o = openDir; // [1,0] or [-1,0]
  }
  return {name:tr('门','Door'), rect:[...rect], h:[hpt[0],hpt[1]], c, o, len};
}
function promptDoorMeta(rect){
  const [x0,y0,x1,y1] = rect, w = x1-x0, h = y1-y0, horiz = w >= h;
  const corner = prompt(tr('铰链角：0左上 1右上 2右下 3左下（默认0）', 'Hinge corner: 0 TL 1 TR 2 BR 3 BL (default 0)'), '0');
  if (corner === null) return null;
  const hc = Math.max(0, Math.min(3, parseInt(corner,10) || 0));
  let openDir;
  if (horiz){
    const ans = prompt(tr('开启方向：上(-1) 或 下(1)，默认下', 'Swing: up (-1) or down (1), default down'), '1');
    if (ans === null) return null;
    openDir = [0, parseInt(ans,10) >= 0 ? 1 : -1];
  } else {
    const ans = prompt(tr('开启方向：左(-1) 或 右(1)，默认右', 'Swing: left (-1) or right (1), default right'), '1');
    if (ans === null) return null;
    openDir = [parseInt(ans,10) >= 0 ? 1 : -1, 0];
  }
  return makeDoorFromRect(rect, hc, openDir);
}
function finishCalibrate(){
  const a = ui.cal?.a, b = ui.cal?.b; if (!a || !b || !state.underlay){ ui.cal = null; renderDraft(); return; }
  const pixDist = Math.hypot(b.x - a.x, b.y - a.y);
  if (pixDist < 1){ toast(tr('两点太近', 'Points too close')); return; }
  const ans = prompt(tr('这两点之间的真实长度（mm）', 'Real length between the two points (mm)'), '3500');
  if (ans === null){ ui.cal = null; renderDraft(); setTool('select'); return; }
  const mm = parseFloat(ans); if (!(mm > 0)){ toast(tr('请输入有效长度', 'Enter a valid length')); return; }
  const u = state.underlay;
  // Current underlay maps image to wMm x hMm. Scale so that current world distance pixDist becomes mm.
  const scale = mm / pixDist;
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  const nw = u.wMm * scale, nh = u.hMm * scale;
  const ox = cx - (cx - u.ox) * scale, oy = cy - (cy - u.oy) * scale;
  mutate(() => { state.underlay = {...u, ox, oy, wMm:nw, hMm:nh}; });
  ui.cal = null; renderDraft(); setTool('wall');
  toast(tr(`已标定：图上该段 = ${Math.round(mm)} mm`, `Calibrated: segment = ${Math.round(mm)} mm`));
  fitView();
}

/* ======================= 视图 ======================= */
function applyView(){
  const W = svg.clientWidth, H = svg.clientHeight;
  svg.setAttribute('viewBox', `${view.x0} ${view.y0} ${W/view.s} ${H/view.s}`);
  const ratio = 1/(view.s*PX_MM);
  $('#ratio').textContent = '1:' + Math.round(ratio);
  const nice = [100,200,500,1000,2000,5000].find(v => v*view.s >= 60) || 5000;
  $('#sbBar').style.width = nice*view.s + 'px';
  $('#sbText').textContent = nice >= 1000 ? `${nice/1000} m` : `${nice} mm`;
  renderSel(); renderMeasure(); renderDraft();
}
function fitView(){
  const W = svg.clientWidth, H = svg.clientHeight;
  view.s = Math.min(W/BOUNDS.w, H/BOUNDS.h);
  view.x0 = BOUNDS.x - (W/view.s - BOUNDS.w)/2; view.y0 = BOUNDS.y - (H/view.s - BOUNDS.h)/2;
  applyView();
}
function zoomAt(ns, mx, my){
  ns = Math.max(.012, Math.min(2, ns));
  const px = view.x0 + mx/view.s, py = view.y0 + my/view.s;
  view.s = ns; view.x0 = px - mx/ns; view.y0 = py - my/ns; applyView();
}
const zoomCenter = k => zoomAt(view.s*k, svg.clientWidth/2, svg.clientHeight/2);
const setRatio = r => zoomAt(1/(r*PX_MM), svg.clientWidth/2, svg.clientHeight/2);

function toMM(e){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

/* ======================= 吸附 ======================= */
const grid = () => 10;
function snapMove(f, cx, cy){
  let nx = Math.round(cx/grid())*grid(), ny = Math.round(cy/grid())*grid();
  if (!ui.layers.wallSnap) return [nx, ny];
  const {hw, hh} = aabb(f), tol = 10/view.s;
  let bx = tol, by = tol;
  for (const r of snapRects()){
    if (!(r[3] < cy-hh-tol || r[1] > cy+hh+tol)) for (const ex of [r[0], r[2]]) for (const c of [ex+hw, ex-hw]) if (Math.abs(c-cx) < bx){ bx = Math.abs(c-cx); nx = c; }
    if (!(r[2] < cx-hw-tol || r[0] > cx+hw+tol)) for (const ey of [r[1], r[3]]) for (const c of [ey+hh, ey-hh]) if (Math.abs(c-cy) < by){ by = Math.abs(c-cy); ny = c; }
  }
  return [nx, ny];
}
function snapPoint(p, shift){
  let x = Math.round(p.x/10)*10, y = Math.round(p.y/10)*10;
  const tol = 8/view.s; let bx = tol, by = tol;
  for (const r of snapRects()){
    for (const ex of [r[0], r[2]]) if (Math.abs(ex-p.x) < bx){ bx = Math.abs(ex-p.x); x = ex; }
    for (const ey of [r[1], r[3]]) if (Math.abs(ey-p.y) < by){ by = Math.abs(ey-p.y); y = ey; }
  }
  if (shift && ui.mA){ if (Math.abs(x-ui.mA.x) > Math.abs(y-ui.mA.y)) y = ui.mA.y; else x = ui.mA.x; }
  return {x, y};
}

/* ======================= 指针交互 ======================= */
let drag = null, pinch = null;
const touches = new Map();                     // 当前按在平面图上的手指
const svgXY = (x, y) => { const r = svg.getBoundingClientRect(); return [x - r.left, y - r.top]; };
function pinchInfo(){
  const [a, b] = [...touches.values()];
  return {d:Math.max(1, Math.hypot(b.x-a.x, b.y-a.y)), c:svgXY((a.x+b.x)/2, (a.y+b.y)/2)};
}
function commitDrawRect(tool, rect){
  let [x0,y0,x1,y1] = normRect(...rect);
  if (Math.abs(x1-x0) < 30 && Math.abs(y1-y0) < 30) return;
  // thin walls: if one side is much smaller, keep as drawn
  if (tool === 'wall'){
    mutate(() => state.geometry.walls.push([x0,y0,x1,y1, ui.wallKind || 'n']));
    toast(tr('已添加墙体', 'Wall added'));
  } else if (tool === 'win'){
    mutate(() => state.geometry.wins.push([x0,y0,x1,y1]));
    toast(tr('已添加窗', 'Window added'));
  } else if (tool === 'slide'){
    const v = (y1-y0) >= (x1-x0);
    mutate(() => state.geometry.slides.push({rect:[x0,y0,x1,y1], v}));
    toast(tr('已添加推拉门', 'Sliding door added'));
  } else if (tool === 'door'){
    const door = promptDoorMeta([x0,y0,x1,y1]);
    if (!door) return;
    mutate(() => state.geometry.doors.push(door));
    toast(tr('已添加门', 'Door added'));
  } else if (tool === 'room'){
    const name = prompt(tr('房间名称', 'Room name'), tr('新房间', 'New room'));
    if (name === null) return;
    const id = 'r' + Date.now().toString(36) + (_n++);
    const poly = R(x0,y0,x1,y1);
    const at = [Math.round((x0+x1)/2), Math.round((y0+y1)/2)];
    const mat = 'tile800';
    mutate(() => {
      state.geometry.roomsDef.push({id, name: name || tr('新房间','New room'), poly, mat, at});
      state.rooms[id] = {name: name || tr('新房间','New room'), mat};
    });
    toast(tr('已添加房间', 'Room added'));
  }
}

// 结束当前拖动：移动过的家具记入撤销栈
function endDrag(cancel){
  const d = drag; drag = null; svg.classList.remove('panning');
  if (!d) return;
  if (d.kind === 'measure'){
    if (cancel){ ui.mA = ui.mCur = null; renderMeasure(); return; }
    if (d.moved && ui.mA && ui.mCur && Math.hypot(ui.mCur.x-ui.mA.x, ui.mCur.y-ui.mA.y) > 20){
      const a = ui.mA, b = ui.mCur; ui.mA = ui.mCur = null; mutate(() => state.measures.push({a, b}));
    }
    renderMeasure(); return;                   // 没拖动：保留起点，等第二次点击
  }
  if (d.kind === 'draw'){
    if (cancel){ ui.draw = null; renderDraft(); return; }
    if (d.moved && ui.draw?.preview?.rect){
      const rect = ui.draw.preview.rect;
      ui.draw = null; renderDraft();
      commitDrawRect(d.tool, rect);
    } else { ui.draw = null; renderDraft(); }
    return;
  }
  if (d.kind === 'calibrate'){
    if (cancel){ ui.cal = null; renderDraft(); return; }
    if (d.moved && ui.cal?.a && ui.cal?.cur && Math.hypot(ui.cal.cur.x-ui.cal.a.x, ui.cal.cur.y-ui.cal.a.y) > 20){
      ui.cal.b = ui.cal.cur; finishCalibrate();
    }
    return;
  }
  if (d.kind === 'pan'){
    if (!cancel && !d.moved && ui.tool === 'select'){
      if (d.pickedMep) return; // 已在 pointerdown 选中管线
      // 几何拾取管线（SVG hit 失败时的兜底）
      if (d.mepPick){ select(d.mepPick); return; }
      if (d.pick) select(d.pick);
      else select(d.room ? {kind:'room', id:d.room} : null);
    }
    return;
  }
  if (d.kind === 'mepVert' || d.kind === 'mepNodeMove'){
    if (d.moved){ commit(d.before); renderAll(); }
    else renderMep();
    return;
  }
  if (d.moved){ commit(d.before); renderAll(); }
}

svg.addEventListener('pointerdown', e => {
  if (e.button === 1 || e.button === 2) return;
  closeDrawers(); $('details.menu').open = false;
  if (e.pointerType !== 'mouse'){
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    svg.setPointerCapture(e.pointerId);
    if (touches.size >= 2){                    // 第二根手指落下：取消单指操作，进入双指缩放 / 平移
      endDrag(drag?.kind === 'measure' || drag?.kind === 'pan');
      const {d, c} = pinchInfo();
      pinch = {d, c, s:view.s, px:view.x0 + c[0]/view.s, py:view.y0 + c[1]/view.s};
      return;
    }
  }
  if (pinch) return;
  const p = toMM(e), t = e.target;
  if (ui.tool === 'measure'){
    const q = snapPoint(p, e.shiftKey);
    if (!ui.mA){ ui.mA = q; ui.mCur = q; drag = {kind:'measure', sx:e.clientX, sy:e.clientY, moved:false}; svg.setPointerCapture(e.pointerId); }
    else { const a = ui.mA; ui.mA = null; ui.mCur = null; if (Math.hypot(q.x-a.x, q.y-a.y) > 20) mutate(() => state.measures.push({a, b:q})); }
    renderMeasure(); return;
  }
  if (ui.tool === 'calibrate'){
    const q = {x:Math.round(p.x), y:Math.round(p.y)};
    if (!ui.cal?.a){ ui.cal = {a:q, cur:q}; drag = {kind:'calibrate', sx:e.clientX, sy:e.clientY, moved:false}; renderDraft(); }
    else {
      ui.cal.b = q; renderDraft();
      finishCalibrate();
    }
    svg.setPointerCapture(e.pointerId); return;
  }
  if (ui.tool === 'mepLine'){
    e.preventDefault();
    enableMepLayers(true);
    const prev = ui.draw?.preview?.pts?.length ? ui.draw.preview.pts[ui.draw.preview.pts.length - 1] : null;
    const q = mepOrthoPoint(prev, p, !e.altKey);
    if (!ui.draw?.preview || ui.draw.preview.type !== 'mepPoly'){
      ui.draw = {preview:{type:'mepPoly', mepType: ui.mepType, pts:[[q.x, q.y]], cur:q}};
      toast(tr('继续点击加点 · 点顶栏「完成」或按 Enter 结束', 'Keep clicking · Finish button or Enter when done'));
    } else {
      const last = ui.draw.preview.pts[ui.draw.preview.pts.length - 1];
      if (Math.hypot(q.x - last[0], q.y - last[1]) > 30) ui.draw.preview.pts.push([q.x, q.y]);
      ui.draw.preview.cur = q;
    }
    renderMep();
    svg.setPointerCapture(e.pointerId); return;
  }
  if (ui.tool === 'mepNode'){
    e.preventDefault();
    enableMepLayers(true);
    const q = mepOrthoPoint(null, p, false);
    placeMepNodeAt(q.x, q.y);
    return;
  }
  if (['wall','win','door','slide','room'].includes(ui.tool)){
    const q = snapPoint(p, true);
    ui.draw = {preview:{type:'rect', rect:[q.x,q.y,q.x,q.y]}};
    drag = {kind:'draw', tool:ui.tool, sx:e.clientX, sy:e.clientY, x0:q.x, y0:q.y, moved:false};
    renderDraft();
    svg.setPointerCapture(e.pointerId); return;
  }
  const h = t.closest('[data-handle]');
  const mepVert = t.closest('[data-mep-vert]');
  const mepRunEl = t.closest('[data-mep-run]');
  const mepNodeEl = t.closest('[data-mep-node]');
  if (h && ui.sel?.kind === 'furn'){
    drag = {kind:h.dataset.handle, id:ui.sel.id, sx:e.clientX, sy:e.clientY, before:snap(), moved:false};
  } else if (ui.tool === 'select' && mepVert){
    const [rid, vi] = mepVert.dataset.mepVert.split(':');
    select({kind:'mepRun', id:rid});
    drag = {kind:'mepVert', rid, vi:+vi, sx:e.clientX, sy:e.clientY, before:snap(), moved:false};
  } else if (ui.tool === 'select' && mepNodeEl){
    select({kind:'mepNode', id:mepNodeEl.dataset.mepNode});
    const n = ensureMep().nodes.find(x => x.id === mepNodeEl.dataset.mepNode);
    drag = {kind:'mepNodeMove', id:n.id, sx:e.clientX, sy:e.clientY, ox:p.x-n.x, oy:p.y-n.y, before:snap(), moved:false};
  } else if (ui.tool === 'select' && mepRunEl){
    select({kind:'mepRun', id:mepRunEl.dataset.mepRun});
    drag = {kind:'pan', sx:e.clientX, sy:e.clientY, x0:view.x0, y0:view.y0, moved:false, pickedMep:true};
  } else if (ui.tool === 'demolish' && t.closest('[data-wall]')){
    toggleWall(t.closest('[data-wall]').dataset.wall); return;
  } else if (ui.tool === 'select' && t.closest('[data-fid]')){
    const f = getF(t.closest('[data-fid]').dataset.fid);
    if (ui.sel?.id !== f.id) select({kind:'furn', id:f.id});
    drag = {kind:'move', id:f.id, sx:e.clientX, sy:e.clientY, ox:p.x-f.cx, oy:p.y-f.cy, before:snap(), moved:false};
  } else {
    let pick = null;
    if (ui.tool === 'select'){
      const win = t.closest('[data-win]'); if (win) pick = {kind:'win', i:+win.dataset.win};
      const door = t.closest('[data-door]'); if (door) pick = {kind:'door', i:+door.dataset.door};
      const slide = t.closest('[data-slide]'); if (slide) pick = {kind:'slide', i:+slide.dataset.slide};
      const wall = t.closest('[data-wall]'); if (wall) pick = {kind:'wall', i:+wall.dataset.wi};
    }
    const room = t.closest('[data-room]');
    // 预先几何拾取管线，松手未拖动时优先选中
    const mepPick = (ui.tool === 'select' && (ui.layers.elec || ui.layers.water || ui.layers.heat))
      ? pickMepAt(p.x, p.y) : null;
    drag = {kind:'pan', sx:e.clientX, sy:e.clientY, x0:view.x0, y0:view.y0, room:room && room.dataset.room, pick, mepPick, moved:false};
  }
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch){
    if (touches.size < 2) return;
    const {d, c} = pinchInfo(), ns = Math.max(.012, Math.min(2, pinch.s * d / pinch.d));
    view.s = ns; view.x0 = pinch.px - c[0]/ns; view.y0 = pinch.py - c[1]/ns; applyView();
    return;
  }
  const p = toMM(e);
  $('#cx').textContent = Math.round(p.x) + ' mm'; $('#cy').textContent = Math.round(p.y) + ' mm';
  if (!drag){
    const room = e.target.closest && e.target.closest('[data-room]');
    $('#hover').innerHTML = room ? (() => { const rr = geoRooms().find(r=>r.id===room.dataset.room); const nm0 = state.rooms[room.dataset.room]?.name || rr?.name || ''; return rr ? `<b>${esc(nm0)}</b> ${fmt(area(rr.poly))} m²` : ''; })() : '';
    if (ui.tool === 'measure' && ui.mA){ ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); }
    if (ui.tool === 'mepLine' && ui.draw?.preview?.type === 'mepPoly'){
      const prev = ui.draw.preview.pts[ui.draw.preview.pts.length - 1];
      ui.draw.preview.cur = mepOrthoPoint(prev, p, !e.altKey);
      renderMep();
    }
    return;
  }
  const far = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) >= TAP;
  if (drag.kind === 'measure'){
    if (far) drag.moved = true;
    ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); return;
  }
  if (drag.kind === 'calibrate'){
    if (far) drag.moved = true;
    if (ui.cal?.a){ ui.cal.cur = {x:Math.round(p.x), y:Math.round(p.y)}; renderDraft(); }
    return;
  }
  if (drag.kind === 'draw'){
    if (far) drag.moved = true;
    const q = snapPoint(p, true);
    let x1 = q.x, y1 = q.y;
    // force orthogonal: prefer dominant axis for thin walls, else free AABB
    ui.draw = {preview:{type:'rect', rect:[drag.x0, drag.y0, x1, y1]}};
    renderDraft(); return;
  }
  if (drag.kind === 'mepVert'){
    if (far) drag.moved = true;
    const run = ensureMep().runs.find(r => r.id === drag.rid);
    if (run?.pts[drag.vi]){
      const q = mepOrthoPoint(null, p, !e.altKey);
      run.pts[drag.vi] = [q.x, q.y];
      renderMep(); renderPanel();
    }
    return;
  }
  if (drag.kind === 'mepNodeMove'){
    if (far) drag.moved = true;
    const n = ensureMep().nodes.find(x => x.id === drag.id);
    if (n){
      const q = mepOrthoPoint(null, {x:p.x-drag.ox, y:p.y-drag.oy}, false);
      n.x = q.x; n.y = q.y;
      renderMep();
    }
    return;
  }
  if (drag.kind === 'pan'){
    if (!drag.moved && !far) return;
    drag.moved = true; svg.classList.add('panning');
    view.x0 = drag.x0 - (e.clientX-drag.sx)/view.s; view.y0 = drag.y0 - (e.clientY-drag.sy)/view.s; applyView(); return;
  }
  const f = getF(drag.id); if (!f) return;
  if (!drag.moved && !far) return;             // 轻点家具不应让它抖动一下
  drag.moved = true;
  if (drag.kind === 'move'){
    [f.cx, f.cy] = snapMove(f, p.x-drag.ox, p.y-drag.oy);
  } else if (drag.kind === 'rot'){
    let a = Math.atan2(p.y-f.cy, p.x-f.cx)*180/Math.PI + 90;
    f.rot = norm(e.shiftKey ? a : Math.round(a/15)*15);
  } else if (drag.kind === 'size'){
    const a = f.rot*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
    const dx = p.x-f.cx, dy = p.y-f.cy, lx = dx*c + dy*s, ly = -dx*s + dy*c;
    const ax = -f.w/2, ay = -f.d/2;
    const nw = Math.max(100, Math.round((lx-ax)/10)*10), nd = Math.max(100, Math.round((ly-ay)/10)*10);
    const mx = ax + nw/2, my = ay + nd/2;
    f.cx += mx*c - my*s; f.cy += mx*s + my*c; f.w = nw; f.d = nd;
  }
  renderFurn(); renderSel();
});

function onPointerEnd(e){
  touches.delete(e.pointerId);
  if (pinch){ if (touches.size < 2) pinch = null; return; }   // 双指结束后，剩下的手指不再触发操作
  endDrag(e.type === 'pointercancel');
}
svg.addEventListener('pointerup', onPointerEnd);
svg.addEventListener('pointercancel', onPointerEnd);
// 阻止 iPad Safari 把双指手势当成整页缩放
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(view.s*Math.exp(-e.deltaY*(e.ctrlKey ? .01 : .0015)), e.clientX-r.left, e.clientY-r.top);
}, {passive:false});
svg.addEventListener('dblclick', e => {
  if (ui.tool === 'mepLine'){ e.preventDefault(); finishMepPoly(); return; }
  if (ui.tool === 'select' && e.target.closest('[data-fid]')) rotateSel(90);
  // 选中管线时双击线段中点附近插入顶点
  if (ui.tool === 'select' && ui.sel?.kind === 'mepRun'){
    const run = ensureMep().runs.find(r => r.id === ui.sel.id);
    if (!run || run.pts.length < 2) return;
    const p = toMM(e);
    let best = -1, bestD = 200;
    for (let i = 0; i < run.pts.length - 1; i++){
      const a = run.pts[i], b = run.pts[i+1];
      const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < bestD){ bestD = d; best = i; }
    }
    if (best >= 0){
      mutate(() => {
        const r = ensureMep().runs.find(x => x.id === ui.sel.id);
        if (!r) return;
        const a = r.pts[best], b = r.pts[best+1];
        r.pts.splice(best + 1, 0, [Math.round((a[0]+b[0])/2), Math.round((a[1]+b[1])/2)]);
      });
    }
  }
});
svg.addEventListener('contextmenu', e => {
  if (ui.tool==='measure'){ e.preventDefault(); ui.mA = null; renderMeasure(); }
  if (ui.tool==='mepLine'){ e.preventDefault(); ui.draw = null; renderMep(); }
});


/* ======================= 键盘 ======================= */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (window.View3D?.walking()) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y'){ e.preventDefault(); redo(); return; }
  if (mod && k === 'd'){ e.preventDefault(); duplicateSel(); return; }
  if (mod) return;
  if (k === '[' || k === ']'){ drawer(k === '[' ? 'lib' : 'panel'); return; }
  if (k === 'f' && e.shiftKey){ toggleFullscreen(); return; }
  if (k === 't') setView(is3D() ? '2d' : '3d');
  else if (is3D() && ['v','m','x','f','+','=','-'].includes(k)) return;
  else if (k === 'v') setTool('select');
  else if (k === 'm') setTool('measure');
  else if (k === 'x') setTool('demolish');
  else if (k === 'w' && !is3D()) setTool('wall');   // 3D 漫游里 W 用于前进
  else if (k === 'f') fitView();
  else if (k === 'r') rotateSel(e.shiftKey ? -90 : 90);
  else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); deleteSel(); }
  else if (k === 'enter' && ui.tool === 'mepLine'){ e.preventDefault(); finishMepPoly(); }
  else if (k === 'escape'){
    if (ui.mA){ ui.mA = null; renderMeasure(); }
    else if (ui.cal || ui.draw){ ui.cal = null; ui.draw = null; renderDraft(); renderMep(); }
    else { if (ui.tool !== 'select') setTool('select'); select(null); }
  }
  else if (k.startsWith('arrow') && ui.sel?.kind === 'furn'){
    e.preventDefault(); const st = e.shiftKey ? 100 : 10;
    mutate(() => { const f = getF(ui.sel.id); if (k==='arrowleft') f.cx -= st; if (k==='arrowright') f.cx += st; if (k==='arrowup') f.cy -= st; if (k==='arrowdown') f.cy += st; });
  }
  else if (k === '+' || k === '=') zoomCenter(1.25);
  else if (k === '-') zoomCenter(.8);
});

/* ======================= 家具库 ======================= */
function buildLib(){
  $('#lib').innerHTML = LIB.map((c,ci) => `<h4>${nm(c.cat)}</h4><div class="lib-grid">${c.items.map((it,ii) => {
    const [t,n,w,d,col] = it, pad = Math.max(w,d)*.08;
    return `<div class="item" data-key="${ci}:${ii}" title="${tr('点击添加，或拖到平面图中的指定位置', 'Click to add, or drag onto the plan')}">
      <svg viewBox="${-w/2-pad} ${-d/2-pad} ${w+2*pad} ${d+2*pad}">${furnSVG(t,w,d,col)}</svg><b>${esc(nm(n))}</b><small>${w}×${d}</small></div>`;
  }).join('')}</div>`).join('') + `<div class="hint">${tr(
    `家具按真实尺寸（mm）绘制。${COARSE ? '点一下放到画面中央，或按住向右拖到平面图 / 3D 地面上的指定位置（上下滑动为滚动列表）。' : '点击添加到画面中央，或直接拖到平面图 / 3D 地面上。'}添加后可在右侧修改宽深与颜色。`,
    `Furniture is drawn at real size (mm). ${COARSE ? 'Tap to place at the center, or hold and drag right onto the plan / 3D floor (swipe up/down to scroll).' : 'Click to add at the center, or drag onto the plan / 3D floor.'} Edit size and color in the right panel afterwards.`)}</div>`;
  document.querySelectorAll('.item').forEach(el => el.addEventListener('pointerdown', e => {
    if (e.button) return;
    libDrag = {el, id:e.pointerId, sx:e.clientX, sy:e.clientY, it:itemOf(el), ghost:null};
  }));
}
const itemOf = el => { const [ci, ii] = el.dataset.key.split(':').map(Number); return LIB[ci].items[ii]; };

// 家具库拖放：用 pointer 事件实现（iPad 上 HTML5 拖放不可靠）。
// 列表设置了 touch-action:pan-y，竖向滑动交给浏览器滚动（会触发 pointercancel），横向拖动才开始拖放。
let libDrag = null;
// 屏幕坐标 → 户型坐标（mm）。2D 取平面图坐标，3D 取射线与地面的交点；s = 该处每 mm 的屏幕像素数
function dropPoint(x, y){
  const r = $('#stage').getBoundingClientRect();
  if (x < r.left || x > r.right || y < r.top || y > r.bottom) return null;
  if (document.elementFromPoint(x, y)?.closest('aside.open,#fab,#walkOverlay,#joy,#walkExit')) return null;
  if (is3D()) return window.View3D?.groundAt(x, y) || null;
  const p = toMM({clientX:x, clientY:y}); return {x:p.x, y:p.y, s:view.s};
}
addEventListener('pointermove', e => {
  if (!libDrag || e.pointerId !== libDrag.id) return;
  const {it} = libDrag;
  if (!libDrag.ghost){
