/* ======================= 从户型图自动识别重建 ======================= */
function morph(mask, W, H, k, mode){
  // mode: 'min' erode, 'max' dilate — square kernel
  const out = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    let v = mode === 'min' ? 1 : 0;
    for (let dy = -k; dy <= k; dy++) for (let dx = -k; dx <= k; dx++){
      const xx = x + dx, yy = y + dy;
      const p = (xx < 0 || yy < 0 || xx >= W || yy >= H) ? 0 : mask[yy * W + xx];
      if (mode === 'min'){ if (!p) v = 0; }
      else if (p) v = 1;
    }
    out[y * W + x] = v;
  }
  return out;
}
function preferWallKind(k1, k2){
  const rank = {b:3, e:2, n:1, low:0};
  return (rank[k1] || 0) >= (rank[k2] || 0) ? k1 : k2;
}
/** 把共线、间距不大的短墙段合并成连续长墙（修复识别断裂） */
function mergeColinearWalls(walls, gapMm = 450, alignMm = 140){
  let segs = walls.map(w => w.slice());
  let changed = true, guard = 0;
  while (changed && guard++ < 40){
    changed = false;
    const used = new Array(segs.length).fill(false), next = [];
    for (let i = 0; i < segs.length; i++){
      if (used[i]) continue;
      let [a, b, c, d, k] = segs[i];
      let horiz = (c - a) >= (d - b);
      used[i] = true;
      let grew = true;
      while (grew){
        grew = false;
        for (let j = 0; j < segs.length; j++){
          if (used[j]) continue;
          const [a2, b2, c2, d2, k2] = segs[j];
          const horiz2 = (c2 - a2) >= (d2 - b2);
          if (horiz !== horiz2) continue;
          if (horiz){
            const y1 = (b + d) / 2, y2 = (b2 + d2) / 2;
            if (Math.abs(y1 - y2) > alignMm) continue;
            if (Math.abs((d - b) - (d2 - b2)) > alignMm * 1.2) continue;
            const gap = Math.max(a2 - c, a - c2); // 重叠则为负
            if (gap > gapMm) continue;
            // 合并：X 取并集；Y 取厚度中心对齐后的统一厚度
            a = Math.min(a, a2); c = Math.max(c, c2);
            const cy = (Math.min(b, b2) + Math.max(d, d2)) / 2;
            const th = Math.max(d - b, d2 - b2);
            b = Math.round(cy - th / 2); d = Math.round(cy + th / 2);
            k = preferWallKind(k, k2);
            used[j] = true; grew = true; changed = true;
          } else {
            const x1 = (a + c) / 2, x2 = (a2 + c2) / 2;
            if (Math.abs(x1 - x2) > alignMm) continue;
            if (Math.abs((c - a) - (c2 - a2)) > alignMm * 1.2) continue;
            const gap = Math.max(b2 - d, b - d2);
            if (gap > gapMm) continue;
            b = Math.min(b, b2); d = Math.max(d, d2);
            const cx = (Math.min(a, a2) + Math.max(c, c2)) / 2;
            const tw = Math.max(c - a, c2 - a2);
            a = Math.round(cx - tw / 2); c = Math.round(cx + tw / 2);
            k = preferWallKind(k, k2);
            used[j] = true; grew = true; changed = true;
          }
        }
      }
      next.push([a, b, c, d, k]);
    }
    segs = next;
  }
  // 厚度归一：过薄/略宽的墙收到常见墙厚，减少碎段观感
  return segs.map(([a, b, c, d, k]) => {
    const tw = c - a, th = d - b, horiz = tw >= th;
    if (horiz){
      let t = th;
      if (t >= 80 && t <= 160) t = 200;
      else if (t > 160 && t < 280) t = Math.round((t + 200) / 2);
      const cy = (b + d) / 2;
      return [a, Math.round(cy - t / 2), c, Math.round(cy + t / 2), k];
    }
    let t = tw;
    if (t >= 80 && t <= 160) t = 200;
    else if (t > 160 && t < 280) t = Math.round((t + 200) / 2);
    const cx = (a + c) / 2;
    return [Math.round(cx - t / 2), b, Math.round(cx + t / 2), d, k];
  });
}
function autoRebuildFromCanvas(cv, totalWmm){
  const W = cv.width, H = cv.height, ctx = cv.getContext('2d');
  const img = ctx.getImageData(0, 0, W, H).data;
  const wall0 = new Uint8Array(W * H);
  for (let i = 0, p = 0; i < img.length; i += 4, p++){
    const lum = (img[i] + img[i + 1] + img[i + 2]) / 3;
    wall0[p] = lum < 55 ? 1 : 0;
  }
  // 开运算去家具细线 → 闭运算填小缺口 → 再略膨胀保证连续
  let core = morph(morph(wall0, W, H, 2, 'min'), W, H, 2, 'max');
  core = morph(morph(core, W, H, 2, 'max'), W, H, 2, 'min'); // close：把断续短墙的像素缝先粘上
  core = morph(core, W, H, 1, 'max');

  let minX = W, minY = H, maxX = 0, maxY = 0, dark = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (core[y * W + x]){
    dark++; if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y;
  }
  if (dark < 200 || maxX <= minX) throw new Error('no-walls');
  const mm = totalWmm / (maxX - minX);
  const totalHmm = Math.round((maxY - minY) * mm);
  const toMm = (x, y) => [Math.round((x - minX) * mm), Math.round((y - minY) * mm)];

  // 提取轴对齐墙矩形（允许行内更多缺口，后面再用毫米级合并补齐）
  const visited = new Uint8Array(W * H);
  const rects = [];
  for (let y = 0; y < H; y++){
    for (let x = 0; x < W; ){
      const i = y * W + x;
      if (!core[i] || visited[i]){ x++; continue; }
      let xe = x; while (xe < W && core[y * W + xe]) xe++;
      let ye = y;
      while (ye < H){
        let hit = 0; for (let xx = x; xx < xe; xx++) if (core[ye * W + xx]) hit++;
        if (hit / (xe - x) < 0.72) break; // 比原来更容忍缺口，减少被拆成碎段
        ye++;
      }
      for (let yy = y; yy < ye; yy++) for (let xx = x; xx < xe; xx++) visited[yy * W + xx] = 1;
      const bw = xe - x, bh = ye - y;
      if (Math.max(bw, bh) >= 5 && Math.min(bw, bh) >= 2) rects.push([x, y, xe, ye]);
      x = xe;
    }
  }
  let walls = [];
  for (const [x0, y0, x1, y1] of rects){
    const [a, b] = toMm(x0, y0), [c, d] = toMm(x1, y1);
    const tw = c - a, th = d - b, t = Math.min(tw, th), L = Math.max(tw, th);
    if (L < 120 || t > 550) continue; // 短段先保留，交给合并
    let kind = 'n';
    if (a < 150 || b < 150 || c > totalWmm - 150 || d > totalHmm - 150) kind = 'e';
    else if (t >= 190) kind = 'b';
    walls.push([a, b, c, d, kind]);
  }
  // 共线短墙合并成连续长墙
  walls = mergeColinearWalls(walls, Math.max(350, Math.round(mm * 18)), Math.max(100, Math.round(mm * 6)));
  walls = walls.filter(w => Math.max(w[2] - w[0], w[3] - w[1]) >= 200);

  // 按地板颜色连通域识别房间
  const label = new Int32Array(W * H); // 0 empty
  function flood(sx, sy, accept, minArea){
    if (!accept(sx, sy) || label[sy * W + sx]) return null;
    const q = [[sx, sy]]; label[sy * W + sx] = 1;
    let qi = 0, minx = sx, maxx = sx, miny = sy, maxy = sy, area = 0;
    let sr = 0, sg = 0, sb = 0;
    while (qi < q.length){
      const [cx, cy] = q[qi++]; area++;
      const o = (cy * W + cx) * 4; sr += img[o]; sg += img[o + 1]; sb += img[o + 2];
      if (cx < minx) minx = cx; if (cx > maxx) maxx = cx; if (cy < miny) miny = cy; if (cy > maxy) maxy = cy;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx = cx + dx, ny = cy + dy;
        if (nx < minX || ny < minY || nx > maxX || ny > maxY) continue;
        const j = ny * W + nx;
        if (label[j] || !accept(nx, ny)) continue;
        label[j] = 1; q.push([nx, ny]);
      }
    }
    if (area < minArea) return null;
    return {minx, maxx, miny, maxy, area, cx: (minx + maxx) >> 1, cy: (miny + maxy) >> 1,
      col: [sr / area, sg / area, sb / area]};
  }
  const isWall = (x, y) => !!core[y * W + x];
  const roomsRaw = [];
  for (let y = minY; y <= maxY; y++) for (let x = minX; x <= maxX; x++){
    if (isWall(x, y) || label[y * W + x]) continue;
    const o = (y * W + x) * 4, r = img[o], g = img[o + 1], b = img[o + 2], lum = (r + g + b) / 3;
    // 木地板 / 地砖 / 白砖 种子
    const wood = r > 170 && g > 140 && b < 200 && (r - b) > 25 && lum > 120;
    const white = r > 225 && g > 225 && b > 220;
    const beige = r > 195 && g > 180 && b > 145 && b < 220 && (r - b) < 50 && lum > 165;
    if (!wood && !white && !beige) continue;
    const kind = wood ? 'wood' : white ? 'white' : 'beige';
    const accept = (xx, yy) => {
      if (isWall(xx, yy)) return false;
      const oo = (yy * W + xx) * 4, rr = img[oo], gg = img[oo + 1], bb = img[oo + 2], L = (rr + gg + bb) / 3;
      if (kind === 'wood') return rr > 160 && gg > 130 && bb < 210 && (rr - bb) > 18 && L > 110;
      if (kind === 'white') return rr > 215 && gg > 215 && bb > 210;
      return rr > 185 && gg > 170 && bb > 140 && bb < 225 && L > 155;

    const comp = flood(x, y, accept, 1800);
    if (!comp) continue;
    roomsRaw.push({...comp, kind});
  }
  roomsRaw.sort((a, b) => b.area - a.area);
  // 去重：被大房间 bbox 基本包含的小块丢掉
  const roomsKept = [];
  for (const r of roomsRaw){
    const contained = roomsKept.some(R => r.minx >= R.minx - 2 && r.maxx <= R.maxx + 2 && r.miny >= R.miny - 2 && r.maxy <= R.maxy + 2 && r.area < R.area * 0.85);
    if (!contained) roomsKept.push(r);
  }

  const contentArea = (maxX - minX) * (maxY - minY);
  let woodN = 0, whiteN = 0, beigeN = 0;
  const roomsDef = [];
  for (const r of roomsKept.slice(0, 20)){
    if (r.area > contentArea * 0.45) continue; // 整图底色误检

    if (r.kind === 'wood'){

      mat = 'wood';
    } else if (r.kind === 'white'){

const asMat = m => typeof m === 'string' ? mat(m) : m;

const mesh = (geo, m) => sh(new THREE.Mesh(geo, asMat(m)));

function box(w, h, d, m, x = 0, y = 0, z = 0){
  const o = mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y + h/2, z); return o;
}
function rbox(w, h, d, m, x = 0, y = 0, z = 0, r = .04){
  const o = mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w/2-.001, h/2-.001, d/2-.001)), m); o.position.set(x, y + h/2, z); return o;

// 旋转体：pts = [[半径, 高度], …] 自下而上，y = 底面
function lathe(pts, m, x = 0, y = 0, z = 0, seg = 40){
  const o = mesh(new THREE.LatheGeometry(pts.map(([r, h]) => new THREE.Vector2(Math.max(r, 1e-4), h)), seg), m); o.position.set(x, y, z); return o;

// 两点之间的圆杆，r0 在 a 端、r1 在 b 端（收分椅腿、斜撑）
function rod(a, b, r0, m, r1 = r0, seg = 12){

}

const tube = (pts, r, m, seg = 40) => mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), false, 'centripetal'), seg, r, 10), m);

}

function fronts(g, x0, y0, w, h, z, nx, ny, m, hd = 'bar', hy = null){
  const gap = .005, pw = w/nx, ph = h/ny, fz = z + .018;
  g.add(box(w, h, .002, '#2a2724', x0 + w/2, y0, z + .001));                     // 缝隙里透出的暗色

/* ======================= 建筑 ======================= */
function clearGroup(g){ g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); g.clear(); }

/* ======================= 管线 MEP 3D（读取可编辑 state.mep） ======================= */
function mepMat(key, color){
  if (mepMats[key]) return mepMats[key];
  return mepMats[key] = new THREE.MeshStandardMaterial({
    color, roughness:.35, metalness:.25, emissive:color, emissiveIntensity:.22,
  });
}
function mepY(h){ return Math.min(h, Math.max(0.06, opt.cut - 0.06)); }
function addPipeRun(g, pts3, radius, material){
  if (!pts3 || pts3.length < 2) return;
  for (let i = 0; i < pts3.length - 1; i++){
    const A = pts3[i], B = pts3[i + 1];
    if (Math.hypot(B[0] - A[0], B[1] - A[1], B[2] - A[2]) < 0.02) continue;
    const pipe = rod(A, B, radius, material, radius, 8);
    pipe.castShadow = false; pipe.receiveShadow = false; g.add(pipe);
    const elbow = blob(radius * 1.35, radius * 1.35, radius * 1.35, material, B[0], B[1], B[2], 8);
    elbow.castShadow = false; elbow.receiveShadow = false; g.add(elbow);
  }
  const start = blob(radius * 1.55, radius * 1.55, radius * 1.55, material, pts3[0][0], pts3[0][1], pts3[0][2], 8);
  start.castShadow = false; start.receiveShadow = false; g.add(start);
}
function buildMep(){
  if (!mepG) return;
  clearGroup(mepG);
  const show = mepOn('elec') || mepOn('water') || mepOn('heat');
  mepG.visible = show;
  syncMepLayerBtns();
  if (!show) return;
  const mep = ensureMep();
  for (const run of mep.runs){
    const meta = MEP_META[run.type]; if (!meta || !ui.layers[meta.layer]) continue;
    if (!run.pts || run.pts.length < 2) continue;
    const z = meta.z;
    const pts3 = run.pts.map(([x, y]) => [wx(x), mepY(z), wz(y)]);
    // 强电接到插座：末端垂落到插座高度
    if (run.type === 'power' || run.type === 'weak'){
      const last = pts3[pts3.length - 1];
      pts3.push([last[0], mepY(0.32), last[2]]);
    }
    addPipeRun(mepG, pts3, meta.r, mepMat(run.type, meta.color));
  }
  for (const n of mep.nodes){
    const meta = MEP_NODE_META[n.kind]; if (!meta || !ui.layers[meta.layer]) continue;
    const m = mepMat('n_' + n.kind, meta.color);
    const x = wx(n.x), z = wz(n.y), y = mepY(meta.z);
    if (n.kind === 'panel' || n.kind === 'weakPanel'){

function buildArch(){
  clearGroup(archFloor); clearGroup(archUp); lampG.clear(); doors.length = 0; colliders = [];

    const m = floorMat(state.rooms[r.id]?.mat || r.mat || 'tile800'), bay = r.counted === false;
    const geo = bay ? new THREE.ExtrudeGeometry(shapeOf(r.poly), {depth:.45, bevelEnabled:false}) : new THREE.ShapeGeometry(shapeOf(r.poly));

    const pane = new THREE.Mesh(new THREE.BoxGeometry(hz ? L : .01, gh, hz ? .01 : L), glassMat); pane.position.set(cx, sill + gh/2, cz); archUp.add(pane);

      [ph - .03, .03].forEach(y => { const fr = new THREE.Mesh(new THREE.BoxGeometry(v ? .04 : pl, .05, v ? pl : .04), frameMat); fr.position.set(x, y, z); archUp.add(fr); });
      [-1, 1].forEach(e => { const fr = new THREE.Mesh(new THREE.BoxGeometry(.04, ph, .04), frameMat); fr.position.set(v ? x : x + e*pl/2, ph/2, v ? z + e*pl/2 : z); archUp.add(fr); });
    });
  });

}

/* ======================= 相机位姿 / 动画 ======================= */
const ease = t => t < .5 ? 4*t*t*t : 1 - (-2*t + 2)**3/2;
const clamp01 = t => Math.max(0, Math.min(1, t));
const pose = (t, p) => ({t, p});
// 与当前 2D 视口完全重合的正俯视位姿：透视相机在该高度下，地面可视高度 = 2D 视口高度
function planPose(){
  const cx = view.x0 + SW()/2/view.s, cy = view.y0 + SH()/2/view.s, visH = SH()/view.s/1000;
  const dist = visH / 2 / Math.tan(FOV/2*Math.PI/180), t = new THREE.Vector3(wx(cx), 0, wz(cy));

}
function isoFrom(P){
  const d = THREE.MathUtils.clamp(P.p.y, 5, 30), dir = new THREE.Vector3(.3, .82, .49).normalize();
  return pose(P.t.clone(), P.t.clone().addScaledVector(dir, d));
}
function homeCenter(){
  const b = BOUNDS; return new THREE.Vector3(wx(b.x + b.w/2), 0, wz(b.y + b.h/2));
}
const isoWhole = () => { const t = homeCenter(); return pose(t, t.clone().add(new THREE.Vector3(5.5, 15.5, 10))); };
const topWhole = () => { const t = homeCenter(); return pose(t, new THREE.Vector3(t.x, 19, t.z + 1e-4)); };
const curPose = () => pose(orbit.target.clone(), camera.position.clone());
// 以目标点为中心做球坐标插值：镜头沿弧线倾斜环绕，而不是直线穿越
function camTween(A, B, e){

}

function animate(dur, fn){ return new Promise(res => { anim = {t0:performance.now(), dur, fn, res}; }); }

  const t = new THREE.Vector3(wx((Math.min(...xs)+Math.max(...xs))/2), .6, wz((Math.min(...ys)+Math.max(...ys))/2));

/* ======================= 进入 / 退出 3D ======================= */
async function enter(){
  init(); active = true;
  renderer.setSize(SW(), SH()); labelRenderer.setSize(SW(), SH()); camera.aspect = SW()/SH(); camera.updateProjectionMatrix();
  // 自定义户型进入 3D 时若尚未开管线，自动打开，避免「看不到」
  if (state.custom && !mepOn('elec') && !mepOn('water') && !mepOn('heat')){
    enableMepLayers(true);
    renderMep();
  }
  sync(true);
  opt.mode = 'orbit'; orbit.enabled = false; showLabels(false);
  const A = planPose(), B = isoFrom(A);
  grow = 0; furnGrow = 0; applyGrow(); setPose(A);
  stage.classList.add('animating');
  startLoop(); renderer.render(scene, camera);
  stage.classList.add('is3d');                       // 交叉淡入：此刻 3D 画面与 2D 平面完全重合
  await wait(420);
  await animate(1700, t => {
    camTween(A, B, ease(clamp01(t/.85)));
    grow = ease(clamp01((t - .1)/.55));
    furnGrow = ease(clamp01((t - .45)/.5));
    applyGrow();
  });
  orbit.enabled = true; showLabels(opt.labels);
  stage.classList.remove('animating');
}
async function exit(){
  if (opt.mode === 'walk'){ walkCtl.unlock(); stopTouchWalk(); $('#hint3d').textContent = HINT_ORBIT; $('#walkOverlay').style.display = 'none'; $('#cross').style.display = 'none';
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir); orbit.target.copy(camera.position).addScaledVector(dir, 3).setY(0); opt.mode = 'orbit'; syncModeBtns(); }
  fly = null; orbit.enabled = false; showLabels(false); stage.classList.add('animating');
  const A = curPose(), B = planPose();
  await animate(1300, t => {
    camTween(A, B, ease(clamp01((t - .1)/.9)));
    furnGrow = 1 - ease(clamp01(t/.45));
    grow = 1 - ease(clamp01((t - .2)/.6));
    applyGrow();
  });
  stage.classList.remove('is3d');                    // 此刻 3D 已压平为正俯视，与 2D 重合后淡出
  await wait(450);
  active = false; cancelAnimationFrame(raf); raf = 0;
  stage.classList.remove('animating');
  grow = furnGrow = 1; applyGrow();
}

/* ======================= 选择 / 拾取 ======================= */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(e){
  if (!e) ptr.set(0, 0);
  else { const r = renderer.domElement.getBoundingClientRect(); ptr.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1); }
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects([...(opt.furn ? [furnG] : []), archUp, archFloor], true);
  for (const h of hits){
    let o = h.object;
    if (o.material === glassMat) continue;
    if (o.userData.door) return {door:o.userData.door, dist:h.distance};
    if (o.userData.room) return {room:o.userData.room};
    while (o && !o.userData.fid && o !== scene) o = o.parent;
    if (o?.userData.fid) return {fid:o.userData.fid};
    return null;                                     // 被墙体挡住
  }
  return null;
}
// 屏幕点 → 地面（y = 0）上的户型坐标 mm；s = 该处每 mm 对应的屏幕像素，用于拖放时的幽灵图大小
const ground0 = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function groundAt(x, y){
  if (!active || anim) return null;
  const r = renderer.domElement.getBoundingClientRect(), hit = new THREE.Vector3();
  ptr.set((x - r.left)/r.width*2 - 1, -(y - r.top)/r.height*2 + 1);
  ray.setFromCamera(ptr, camera);
  if (!ray.ray.intersectPlane(ground0, hit) || hit.distanceTo(camera.position) > 60) return null;
  // 视线先碰到墙体（或飘窗台）时，落点取碰到的位置，而不是穿过墙落到看不见的墙后
  const wall = ray.intersectObjects([archUp, archFloor], true).find(h => h.object.material !== glassMat && h.object.visible);
  if (wall && wall.distance < hit.distanceTo(camera.position) - .01) hit.set(wall.point.x, 0, wall.point.z);
  const px = v => new THREE.Vector2(v.x*r.width/2, v.y*r.height/2), a = px(hit.clone().project(camera));
  const s = Math.max(a.distanceTo(px(hit.clone().add(new THREE.Vector3(1, 0, 0)).project(camera))),
                     a.distanceTo(px(hit.clone().add(new THREE.Vector3(0, 0, 1)).project(camera)))) / 1000;
  return {x:hit.x*1000 + OX, y:hit.z*1000 + OY, s};
}
function updateSel(){
  const key = ui.sel?.kind === 'furn' ? ui.sel.id : '';
  if (key !== selKey){
    selKey = key;
    if (selHelper){ scene.remove(selHelper); selHelper.geometry.dispose(); selHelper = null; }
    const g = key && furnG.children.find(g => g.userData.fid === key);
    if (g){ selHelper = new THREE.BoxHelper(g, 0xb5653a); scene.add(selHelper); }
  }
  if (selHelper) selHelper.update();
}

function stopTouchWalk(){
  touchWalk = false; freeWalk = false; walkStarted = false;
  joy.x = joy.y = 0; joy.id = null; $('#joy i').style.transform = '';
  $('#joy').style.display = 'none'; $('#walkExit').style.display = 'none'; $('#cross').style.display = 'none';
}
function bindJoystick(){
  const el = $('#joy'), knob = $('#joy i'), R = 50;
  const upd = e => {
    const r = el.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    const L = Math.hypot(dx, dy); if (L > R){ dx *= R/L; dy *= R/L; }
    joy.x = dx/R; joy.y = dy/R; knob.style.transform = `translate(${dx}px,${dy}px)`;
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); joy.id = e.pointerId; el.setPointerCapture(e.pointerId); upd(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId === joy.id) upd(e); });
  const end = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function walkSpawnCandidates(){
  const list = [];
  const entry = geoDoors().find(d => d.entry) || geoDoors()[0];
  if (entry){
    const [x0,y0,x1,y1] = entry.rect, cx = (x0+x1)/2, cy = (y0+y1)/2;
    list.push({
      ex: cx - (entry.c?.[0] || 0) * 1200, ez: cy - (entry.c?.[1] || 0) * 1200,
      lx: cx + (entry.o?.[0] || 1) * 2000, lz: cy + (entry.o?.[1] || 0) * 2000,
    });
    // 门内侧也试一下（自动重建户型常常没有可靠外侧）
    list.push({ex: cx + (entry.o?.[0] || 0) * 600, ez: cy + (entry.o?.[1] || 0) * 600, lx: cx, lz: cy});
  }
  for (const r of geoRooms()){
    if (r.counted === false) continue;
    if (r.at) list.push({ex:r.at[0], ez:r.at[1], lx:r.at[0], lz:r.at[1] - 800});
    const b = bbox(r.poly);
    list.push({ex:(b[0]+b[2])/2, ez:(b[1]+b[3])/2, lx:(b[0]+b[2])/2, lz:b[1]});
  }
  list.push({ex:4200, ez:8755, lx:7000, lz:8755});
  return list;
}
function placeWalkCamera(){
  const tryPose = (ex, ez, lx, lz) => {
    const x = wx(ex), z = wz(ez);
    if (blocked(x, z, .28)) return false;
    camera.position.set(x, 1.6, z);
    camera.lookAt(wx(lx), 1.5, wz(lz));
    return true;
  };
  for (const c of walkSpawnCandidates()){
    if (tryPose(c.ex, c.ez, c.lx, c.lz)) return;
  }
  // 螺旋搜索空地（米）
  for (const c of walkSpawnCandidates()){
    const cx = wx(c.ex), cz = wz(c.ez);
    for (let rad = .4; rad <= 4; rad += .4){
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 6){
        const x = cx + Math.cos(a) * rad, z = cz + Math.sin(a) * rad;
        if (!blocked(x, z, .28)){
          camera.position.set(x, 1.6, z);
          camera.lookAt(cx, 1.5, cz);
          return;
        }
      }
    }
  }
  // 实在没有：放第一候选并忽略碰撞起步（至少能看见场景）
  const c = walkSpawnCandidates()[0];
  camera.position.set(wx(c.ex), 1.6, wz(c.ez));
  camera.lookAt(wx(c.lx), 1.5, wz(c.lz));
}
function setMode(m){
  if (anim) return;
  opt.mode = m; syncModeBtns();
  if (m === 'walk'){
    window.select(null);
    if (opt.cut < H){ opt.cut = H; syncCutBtns(); sync(); }
    orbit.enabled = false; fly = null;
    walkStarted = false; freeWalk = false; touchWalk = false;
    placeWalkCamera();
    $('#walkOverlay').style.display = 'flex';
    $('#walkExit').style.display = 'none'; $('#cross').style.display = 'none';
    syncHint3d();
  } else {
    try { if (walkCtl?.isLocked) walkCtl.unlock(); } catch(e) {}
    stopTouchWalk(); orbit.enabled = true;
    $('#walkOverlay').style.display = 'none'; $('#cross').style.display = 'none';
    syncHint3d();
    orbit.target.copy(homeCenter()); flyTo(isoWhole());
  }
  showLabels(opt.labels && m === 'orbit');
  archUp.traverse(o => { if (o.userData.walkOnly) o.visible = m === 'walk'; });
}
function blocked(x, z, r = .22){
  for (const [x0, z0, x1, z1] of colliders) if (x > x0 - r && x < x1 + r && z > z0 - r && z < z1 + r) return true;
  for (const d of doors){
    const a = d.pivot.rotation.y, px = d.pivot.position.x, pz = d.pivot.position.z, ex = px + Math.cos(a)*.9, ez = pz - Math.sin(a)*.9;
    const t = clamp01(((x-px)*(ex-px) + (z-pz)*(ez-pz)) / ((ex-px)**2 + (ez-pz)**2));
    if (Math.hypot(x - (px + t*(ex-px)), z - (pz + t*(ez-pz))) < r*.8) return true;
  }
  return false;
}
function stepWalk(dt){
  if (!walkStarted && !walkCtl.isLocked && !touchWalk && !freeWalk) return;
  const sp = (keys.ShiftLeft || keys.ShiftRight || keys.Shift ? 2.6 : 1.4) * dt;
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd); fwd.y = 0;
  if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1); else fwd.normalize();
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x), mv = new THREE.Vector3();
  if (keys.KeyW || keys.Keyw || keys.ArrowUp || keys.w) mv.add(fwd);
  if (keys.KeyS || keys.Keys || keys.ArrowDown || keys.s) mv.sub(fwd);
  if (keys.KeyD || keys.Keyd || keys.ArrowRight || keys.d) mv.add(right);
  if (keys.KeyA || keys.Keya || keys.ArrowLeft || keys.a) mv.sub(right);
  if (touchWalk){ mv.addScaledVector(fwd, -joy.y).addScaledVector(right, joy.x); }
  const mag = Math.min(1, mv.length());        // 摇杆推得越远走得越快
  if (mag < .05) return;
  mv.normalize().multiplyScalar(sp * mag);
  const p = camera.position;
  // 若已卡在墙内，允许先走出来
  const stuck = blocked(p.x, p.z, .2);
  if (stuck || !blocked(p.x + mv.x, p.z)) p.x += mv.x;
  if (stuck || !blocked(p.x, p.z + mv.z)) p.z += mv.z;
}
function onWalkKeyDown(e){
  if (!active) return;
  if (e.target?.matches?.('input,select,textarea')) return;
  // 漫游遮罩还在时按键也直接开始，避免「点了没反应」
  if (opt.mode === 'walk' && !walkStarted && !e.metaKey && !e.ctrlKey &&
      ['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.code || e.key)){
    if (COARSE) startTouchWalk(); else startFreeWalk();
  }
  if (e.code) keys[e.code] = true;
  if (e.key) keys[e.key] = true;           // 兼容只带 key 的事件
  if (e.key) keys[e.key.toLowerCase()] = true;
  if (opt.mode === 'walk' && (e.code === 'KeyW' || e.code === 'KeyA' || e.code === 'KeyS' || e.code === 'KeyD' || (e.code||'').startsWith('Arrow') || 'wasd'.includes((e.key||'').toLowerCase()))) e.preventDefault();
  if (opt.mode === 'walk' && (e.code === 'KeyE' || e.key === 'e' || e.key === 'E')){
    const h = pick(); if (h?.door && h.dist < 2.5) h.door.open = !h.door.open;
  }
}
function onWalkKeyUp(e){
  if (e.code) keys[e.code] = false;
  if (e.key){ keys[e.key] = false; keys[e.key.toLowerCase()] = false; }
}
// 捕获阶段监听，避免焦点在按钮上时丢键；document + window 双保险
document.addEventListener('keydown', onWalkKeyDown, true);
document.addEventListener('keyup', onWalkKeyUp, true);
addEventListener('keydown', onWalkKeyDown);
addEventListener('keyup', onWalkKeyUp);

/* ======================= 工具栏 ======================= */
function syncModeBtns(){ document.querySelectorAll('#modes3d .btn').forEach(b => b.classList.toggle('on', b.dataset.mode === opt.mode)); }
function syncCutBtns(){ document.querySelectorAll('[data-cut]').forEach(b => b.classList.toggle('on', +b.dataset.cut === opt.cut)); }
function syncWalkTexts(){
  const t = COARSE
    ? [tr('点击开始，从入户门进入', 'Tap to start at the front door'), tr('左下摇杆移动 · 在画面上拖动转向', 'Joystick moves · drag on screen to look'),
       tr('点门开关 · 点「退出漫游」回到鸟瞰', 'Tap doors to open · "Exit walk" returns to orbit')]
    : [tr('先点击此面板开始漫游', 'Click this panel first to start walking'),
       tr('<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移动 · 鼠标/拖动转向 · <kbd>Shift</kbd> 快走', '<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move · mouse/drag looks · <kbd>Shift</kbd> runs'),
       tr('<kbd>E</kbd> 开关正前方的门 · 右下角可退出漫游', '<kbd>E</kbd> opens the door ahead · use Exit walk at bottom-right')];
  t.forEach((h, i) => $('#wo' + (i + 1)).innerHTML = h);
  syncHint3d();
}
function bindUI(){
  document.querySelectorAll('#modes3d .btn').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  // 点击即开始：桌面 WASD+拖动转向，触屏摇杆（不再等 PointerLock）
  $('#walkOverlay').onclick = e => {
    e.preventDefault(); e.stopPropagation();
    if (COARSE) startTouchWalk();
    else startFreeWalk();
  };
  $('#walkExit').onclick = () => setMode('orbit');
  bindJoystick();
  syncWalkTexts();
  $('#vIso').onclick = () => { if (opt.mode === 'walk') setMode('orbit'); else flyTo(isoWhole()); };
  $('#vTop').onclick = () => { if (opt.mode === 'walk') setMode('orbit'); flyTo(topWhole()); };
  document.querySelectorAll('[data-cut]').forEach(b => b.onclick = () => { if (opt.mode === 'walk') return; opt.cut = +b.dataset.cut; syncCutBtns(); sync(); });
  document.querySelectorAll('#toggles3d .btn').forEach(b => b.onclick = () => {
    const k = b.dataset.t;
    if (k === 'elec' || k === 'water' || k === 'heat'){
      ui.layers[k] = !ui.layers[k];
      syncMepLayerBtns();
      renderMep();
      buildMep();
      return;
    }
    opt[k] = !opt[k]; b.classList.toggle('on', opt[k]);
    if (k === 'furn'){ furnG.visible = opt.furn; if (!opt.furn && ui.sel?.kind === 'furn') window.select(null); }
    if (k === 'labels') showLabels(opt.labels && opt.mode === 'orbit' && !anim);
    if (k === 'night') applyLight();
  });
  $('#sun').oninput = e => { opt.hour = +e.target.value; applyLight(); };
}

/* ======================= 主循环 ======================= */
const clock = new THREE.Clock();
function startLoop(){ if (!raf){ clock.getDelta(); raf = requestAnimationFrame(loop); } }
function loop(){
  raf = requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), now = performance.now();
  if (anim){ const t = clamp01((now - anim.t0)/anim.dur); anim.fn(t); if (t >= 1){ const r = anim.res; anim = null; r(); } }
  else if (fly){ const t = clamp01((now - fly.t0)/fly.dur); camTween(fly.A, fly.B, ease(t)); if (t >= 1) fly = null; }
  else if (opt.mode === 'orbit') orbit.update();
  else stepWalk(dt);
  doors.forEach(d => { const tg = d.open ? d.a1 : d.a0; d.cur += (tg - d.cur) * Math.min(1, dt*6); d.pivot.rotation.y = d.cur; });
  updateSel();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

function shot(){ const a = document.createElement('a'); a.download = tr('户型装修方案', 'floor-plan-design') + '-3D.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click(); }

function relang(){ syncWalkTexts(); if (inited) buildLabels(); }

window.View3D = {
  enter, exit, relang, sync:() => sync(), syncMep:() => { if (inited) buildMep(); }, shot, groundAt,
  flyToRoom:id => active && !anim && flyToRoom(id),
  walking:() => active && opt.mode === 'walk',
  walkState:() => ({mode:opt.mode, walkStarted, freeWalk, touchWalk, locked:!!walkCtl?.isLocked,
    overlay:$('#walkOverlay')?.style.display, cam:camera ? [+camera.position.x.toFixed(3), +camera.position.y.toFixed(3), +camera.position.z.toFixed(3)] : null,
    keys: {...keys}}),
  // 测试：直接按住前进
  _hold(code, on){ keys[code] = !!on; if (code.startsWith('Key')) keys[code.slice(3).toLowerCase()] = !!on; },
};
